<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tracker de Misiones · Turnos &amp; Recursos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --lila:#60507B; --amatista:#6B62AE; --lavanda:#AD9CBC; --rosapolvo:#C59FB3;
  --rosa:#D6A6B9; --melocoton:#E0B9A6; --perla:#EDE4EB; --champagne:#E7D0A8;
  --oro:#C2A27A; --cristal:#8D9BCB; --salvia:#68705F; --ciruela:#5A445E; --carbon:#36291B;
  --f-title:'Cinzel Decorative',serif; --f-name:'Cormorant Garamond',serif;
  --f-script:'Allura',cursive; --f-body:'Quicksand',sans-serif;
  --glass:rgba(255,255,255,.55); --line:rgba(var(--lila-rgb),.18);
  --radius:18px;
  --lila-rgb:96,80,123; --amatista-rgb:107,98,174; --lavanda-rgb:173,156,188; --rosapolvo-rgb:197,159,179;
  --rosa-rgb:214,166,185; --perla-rgb:237,228,235; --champagne-rgb:231,208,168; --oro-rgb:194,162,122;
  --cristal-rgb:141,155,203; --ciruela-rgb:90,68,94; --carbon-rgb:54,41,27;
  --muted:#7a6a80; --ink:#36291B; --modal-bg:rgba(247,241,246,.97); --champagne-soft:#f4e6cc;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:var(--f-body); color:var(--ink); font-size:14px; line-height:1.45;
  background:
    radial-gradient(1px 1px at 12% 18%,#fff 60%,transparent 61%),
    radial-gradient(1px 1px at 72% 8%,#fff 60%,transparent 61%),
    radial-gradient(1.5px 1.5px at 40% 60%,rgba(var(--champagne-rgb),.9) 60%,transparent 61%),
    radial-gradient(1px 1px at 88% 44%,#fff 60%,transparent 61%),
    radial-gradient(1px 1px at 25% 82%,#fff 60%,transparent 61%),
    radial-gradient(900px 600px at 0% 0%,rgba(var(--lavanda-rgb),.55),transparent 60%),
    radial-gradient(800px 600px at 100% 10%,rgba(var(--rosa-rgb),.45),transparent 60%),
    radial-gradient(900px 700px at 50% 100%,rgba(var(--cristal-rgb),.40),transparent 60%),
    var(--perla);
  background-attachment:fixed; min-height:100vh;
}
::selection{background:var(--rosa);color:var(--carbon)}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px 120px}

/* ───── HEADER ───── */
.hero{
  position:relative; margin:18px auto 22px; padding:30px 22px 26px; text-align:center;
  border-radius:26px; color:var(--perla); overflow:hidden;
  background:
    radial-gradient(500px 200px at 20% 0%,rgba(var(--amatista-rgb),.75),transparent 70%),
    radial-gradient(500px 220px at 85% 100%,rgba(var(--rosapolvo-rgb),.55),transparent 70%),
    linear-gradient(135deg,var(--ciruela),var(--lila) 55%,var(--amatista));
  box-shadow:0 18px 40px -18px rgba(var(--ciruela-rgb),.7), inset 0 0 0 1px rgba(var(--champagne-rgb),.55), inset 0 0 0 6px rgba(255,255,255,.04), inset 0 0 0 7px rgba(var(--oro-rgb),.45);
}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:
   radial-gradient(1.5px 1.5px at 10% 30%,#fff,transparent 60%),
   radial-gradient(1px 1px at 30% 70%,#fff,transparent 60%),
   radial-gradient(2px 2px at 62% 22%,var(--champagne),transparent 60%),
   radial-gradient(1px 1px at 78% 66%,#fff,transparent 60%),
   radial-gradient(1.5px 1.5px at 92% 26%,#fff,transparent 60%),
   radial-gradient(1px 1px at 50% 88%,var(--champagne),transparent 60%);
  animation:twinkle 5s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.45}to{opacity:1}}
.hero h1{font-family:var(--f-title);font-weight:700;letter-spacing:.06em;margin:0;font-size:clamp(22px,4vw,38px);
  background:linear-gradient(90deg,var(--champagne),#fff 40%,var(--rosa) 70%,var(--champagne));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .script{font-family:var(--f-script);font-size:clamp(22px,3vw,32px);color:var(--rosa);margin-top:2px}
.hero .moon{position:absolute;top:16px;left:22px;width:44px;opacity:.9}
.hero .bfly{position:absolute;width:54px;opacity:.9;animation:flut 4s ease-in-out infinite}
.hero .bfly.a{right:26px;top:14px}
.hero .bfly.b{left:18%;bottom:6px;width:34px;animation-delay:-1.6s;opacity:.7}
@keyframes flut{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-6px) rotate(4deg)}}
.nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}

/* ───── BUTTONS ───── */
.btn{border:0;cursor:pointer;border-radius:999px;padding:9px 18px;font-weight:600;letter-spacing:.02em;
  background:rgba(255,255,255,.7);color:var(--lila);box-shadow:inset 0 0 0 1px rgba(var(--oro-rgb),.6);transition:.2s}
.btn:hover{background:#fff;transform:translateY(-1px)}
.btn.prime{color:var(--carbon);background:linear-gradient(135deg,var(--champagne),var(--melocoton) 50%,var(--rosa));box-shadow:0 6px 18px -8px rgba(var(--lila-rgb),.8),inset 0 0 0 1px rgba(255,255,255,.7)}
.btn.dark{background:linear-gradient(135deg,var(--lila),var(--amatista));color:var(--perla);box-shadow:inset 0 0 0 1px rgba(var(--champagne-rgb),.6)}
.btn.ghost{background:transparent;color:inherit;box-shadow:inset 0 0 0 1px currentColor;opacity:.85}
.btn.sm{padding:5px 12px;font-size:12px}
.btn.on{background:var(--champagne);color:var(--carbon)}
.x{border:0;background:transparent;cursor:pointer;color:var(--rosapolvo);font-size:16px;line-height:1;padding:2px 6px;border-radius:8px}
.x:hover{background:rgba(var(--rosapolvo-rgb),.2);color:var(--ciruela)}

/* ───── GLASS PANELS ───── */
.panel{position:relative;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-radius:var(--radius);padding:18px;box-shadow:0 10px 30px -18px rgba(var(--ciruela-rgb),.55),inset 0 0 0 1px rgba(255,255,255,.8),inset 0 0 0 2px rgba(var(--oro-rgb),.25)}
.sec-title{font-family:var(--f-title);font-size:13px;letter-spacing:.18em;color:var(--lila);text-align:center;margin:0 0 10px;display:flex;align-items:center;gap:10px}
.sec-title::before,.sec-title::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--oro),transparent)}
.muted{color:var(--muted);font-size:12px}

/* ───── HOME ───── */
.home{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;margin-top:10px}
.home .panel h2{font-family:var(--f-name);font-size:28px;margin:0;color:var(--lila)}
.home .panel .script{font-family:var(--f-script);font-size:24px;color:var(--rosapolvo);margin:-4px 0 10px}
.home ol{padding-left:18px;margin:8px 0 0}
.home li{margin:4px 0}

/* ───── INPUTS ───── */
.in{width:100%;border:0;border-radius:10px;padding:6px 9px;background:rgba(255,255,255,.75);box-shadow:inset 0 0 0 1px var(--line);outline:none;transition:.15s}
.in:focus{box-shadow:inset 0 0 0 2px var(--cristal);background:#fff}
.in.num{text-align:center;padding:6px 4px;-moz-appearance:textfield}
.in.num::-webkit-inner-spin-button{opacity:.4}
textarea.in{resize:vertical;min-height:60px}
.code-box{width:100%;text-transform:none;font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all;min-height:110px}
label.f{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--lila);margin:0 0 4px}

/* ───── MISSION BAR ───── */
.mbar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:14px}
.mbar .grow{flex:1;min-width:220px}
.meta{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.18);box-shadow:inset 0 0 0 1px rgba(var(--champagne-rgb),.5)}

/* ───── TABS ───── */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 16px;align-items:center}
.tab{border:0;cursor:pointer;padding:9px 18px;border-radius:14px 14px 4px 4px;font-family:var(--f-name);font-size:17px;font-weight:700;
  background:rgba(255,255,255,.45);color:var(--lila);box-shadow:inset 0 -2px 0 rgba(var(--oro-rgb),.4)}
.tab.act{background:linear-gradient(180deg,#fff,rgba(var(--perla-rgb),.9));color:var(--ciruela);box-shadow:inset 0 -3px 0 var(--amatista),0 6px 14px -10px var(--lila)}
.tab .dot{color:var(--oro);margin-right:4px}

/* ───── TABLILLA ───── */
.tb-head{display:grid;grid-template-columns:1fr 130px;gap:12px;align-items:end;margin-bottom:12px}
.rules{margin-top:10px}
.rules summary{cursor:pointer;font-weight:700;color:var(--lila);font-size:13px}
.rules-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:10px}

/* master strip */
.master{margin-bottom:18px;background:linear-gradient(135deg,rgba(var(--lila-rgb),.92),rgba(var(--amatista-rgb),.88));color:var(--perla)}
.master .sec-title{color:var(--champagne)}
.master .in{background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 1px rgba(var(--champagne-rgb),.4);color:var(--perla)}
.master .in::placeholder{color:rgba(var(--perla-rgb),.6)}
.master-row{display:grid;grid-template-columns:220px 1fr auto;gap:14px;align-items:center}
.mname{font-family:var(--f-name);font-size:22px;font-weight:700}

/* turn chips */
.turns{display:flex;flex-wrap:wrap;gap:5px}
.tcell{display:flex;flex-direction:column;align-items:center;gap:2px}
.tcell small{font-size:9px;font-weight:700;letter-spacing:.06em;opacity:.7}
.tsel{appearance:none;-webkit-appearance:none;border:0;cursor:pointer;width:34px;height:30px;border-radius:9px;text-align:center;text-align-last:center;font-weight:700;font-size:12px;padding:0}
span.tsel{display:inline-flex;align-items:center;justify-content:center;cursor:default}
label.tsel{position:relative;display:inline-flex;align-items:center;justify-content:center;transition:transform .15s}
label.tsel:hover{transform:translateY(-1px)}
label.tsel select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:14px}
.st-_{background:rgba(255,255,255,.55);color:var(--lavanda);box-shadow:inset 0 0 0 1px var(--line)}
.st-R{background:var(--salvia);color:#fff}
.st-N{background:var(--cristal);color:#fff}
.st-L{background:var(--melocoton);color:var(--carbon)}
.st-J{background:var(--champagne);color:var(--carbon);box-shadow:inset 0 0 0 1px var(--oro)}
.st-I{background:var(--ciruela);color:var(--rosa)}
.st-S{background:var(--perla);color:var(--rosapolvo);box-shadow:inset 0 0 0 1px var(--rosapolvo)}
.st-Y{background:var(--champagne);color:var(--carbon)}
.st-F{background:var(--rosapolvo);color:#fff}
.st-X{background:var(--champagne);color:var(--carbon);box-shadow:inset 0 -4px 0 var(--rosapolvo)}
.fcnt{width:34px;height:20px;margin-top:2px;border:0;border-radius:6px;text-align:center;font-size:11px;font-weight:700;padding:0;background:rgba(255,255,255,.9);color:var(--carbon);box-shadow:inset 0 0 0 1px var(--rosapolvo);-moz-appearance:textfield}
.fcnt::-webkit-inner-spin-button{opacity:1;height:16px}
.mlegend{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center;font-size:11.5px;margin-top:12px;opacity:.9}
.mlegend span{display:inline-flex;align-items:center;gap:6px}
.mlegend i{font-style:normal;font-size:10px;font-weight:700;min-width:22px;height:18px;padding:0 4px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center}
.master .st-_{background:rgba(255,255,255,.12);color:rgba(var(--perla-rgb),.55);box-shadow:inset 0 0 0 1px rgba(var(--champagne-rgb),.35)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12px;margin:2px 0 16px;justify-content:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:5px;display:inline-block}

/* pills */
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.7);box-shadow:inset 0 0 0 1px rgba(var(--oro-rgb),.5);white-space:nowrap}
.pill.gold{background:linear-gradient(135deg,var(--champagne),var(--champagne-soft));color:var(--carbon)}
.master .pill{background:rgba(255,255,255,.14);color:var(--perla);box-shadow:inset 0 0 0 1px rgba(var(--champagne-rgb),.5)}
.master .pill.gold{background:var(--champagne);color:var(--carbon)}

/* progress */
.prog{height:8px;border-radius:99px;background:rgba(var(--lila-rgb),.12);overflow:hidden;margin-top:8px}
.prog>b{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--amatista),var(--rosa),var(--champagne));transition:width .3s}

/* ───── CHARACTER CARD ───── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,560px),1fr));gap:20px}
.card{padding:0;overflow:hidden}
.card-top{display:grid;grid-template-columns:150px 1fr;gap:16px;padding:18px;position:relative;
  background:linear-gradient(135deg,rgba(var(--lavanda-rgb),.45),rgba(var(--rosa-rgb),.35) 50%,rgba(var(--cristal-rgb),.35))}
.card-top .bfly{position:absolute;right:14px;bottom:10px;width:34px;opacity:.75;animation:flut 5s ease-in-out infinite}
.portrait{width:150px;height:200px;border-radius:75px 75px 12px 12px;overflow:hidden;position:relative;
  background:linear-gradient(160deg,var(--lavanda),var(--rosa));
  box-shadow:0 0 0 3px #fff,0 0 0 5px var(--oro),0 12px 24px -12px rgba(var(--ciruela-rgb),.8)}
.portrait img{width:100%;height:100%;object-fit:cover;display:block}
.portrait .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;font-size:11px;padding:10px;gap:4px}
.portrait .ph svg{width:40px;opacity:.85}
.who .cname{font-family:var(--f-name);font-size:30px;font-weight:700;line-height:1.05;color:var(--ciruela)}
.who .csub{font-family:var(--f-script);font-size:24px;color:var(--lila);line-height:1.1;margin:2px 0 4px}
.who .cplayer{font-size:12px;font-weight:600;color:var(--salvia);margin-bottom:10px}
.who .in{margin-bottom:6px}
.who .in.name{font-family:var(--f-name);font-size:22px;font-weight:700}
.who .in.sub{font-family:var(--f-script);font-size:20px}
.card-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:14px}
.block{background:rgba(255,255,255,.5);border-radius:14px;padding:12px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.9)}
.block h4{margin:0 0 8px;font-family:var(--f-title);font-size:11.5px;letter-spacing:.14em;color:var(--lila);display:flex;align-items:center;gap:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* stat rows */
.stat{display:grid;grid-template-columns:1fr 56px 56px;gap:6px;align-items:center;margin-bottom:6px}
.stat .lbl{font-size:12.5px;font-weight:600}
.stat .bar{grid-column:1/-1;margin-top:-2px}
.vstat{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;font-weight:600;margin-bottom:2px}
.vstat b{font-family:var(--f-name);font-size:18px;color:var(--ciruela)}
.segs{display:flex;gap:2px;flex-wrap:wrap}
.segs i{flex:1;min-width:6px;max-width:22px;height:9px;border-radius:3px;background:rgba(var(--lavanda-rgb),.28);box-shadow:inset 0 0 0 1px rgba(var(--lila-rgb),.08)}
.segs i.f{background:linear-gradient(180deg,var(--rosa),var(--amatista))}
.fillbar{height:9px;border-radius:99px;background:rgba(var(--lavanda-rgb),.28);overflow:hidden}
.fillbar b{display:block;height:100%;background:linear-gradient(90deg,var(--amatista),var(--rosa))}
.bar.heal .segs i.f,.bar.heal .fillbar b{background:linear-gradient(180deg,var(--rosapolvo),var(--ciruela))}
.bar.pa .segs i.f,.bar.pa .fillbar b{background:linear-gradient(180deg,var(--champagne),var(--oro))}
.rest{font-size:10.5px;color:var(--muted);text-align:right;margin-top:1px}

/* collapsible */
details.fold{background:rgba(255,255,255,.5);border-radius:14px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.9)}
details.fold>summary{list-style:none;cursor:pointer;padding:11px 12px;font-family:var(--f-title);font-size:11.5px;letter-spacing:.14em;color:var(--lila);display:flex;align-items:center;gap:8px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"✦";margin-left:auto;color:var(--oro);transition:.25s}
details.fold[open]>summary::after{transform:rotate(45deg)}
details.fold .cnt{font-family:var(--f-body);font-size:11px;letter-spacing:0;background:var(--perla);color:var(--lila);padding:1px 8px;border-radius:99px}
.fold-in{padding:0 12px 12px}
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:separate;border-spacing:0 4px;font-size:12.5px}
table.t th{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--lila);text-align:left;padding:0 4px;font-weight:700}
table.t td{padding:0 3px;vertical-align:middle}
table.t.view td{background:rgba(255,255,255,.65);padding:6px 8px}
table.t.view td:first-child{border-radius:9px 0 0 9px}
table.t.view td:last-child{border-radius:0 9px 9px 0}
table.t .c-num{width:58px;text-align:center}
table.t .c-x{width:26px}
.catrow td{font-family:var(--f-name);font-weight:700;font-size:15px;color:var(--ciruela);padding-top:8px!important;background:transparent!important}
.notes{white-space:pre-wrap;font-size:13px}
.addrow{margin-top:6px}
.card-foot{display:flex;gap:8px;justify-content:flex-end;padding:0 18px 16px}
.empty{text-align:center;padding:40px 20px}
.empty .script{font-family:var(--f-script);font-size:30px;color:var(--rosapolvo)}

/* ───── SAVE BAR ───── */
.savebar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:20;display:flex;gap:8px;align-items:center;
  padding:8px 8px 8px 16px;border-radius:999px;background:rgba(var(--ciruela-rgb),.92);backdrop-filter:blur(8px);color:var(--perla);
  box-shadow:0 14px 34px -12px rgba(var(--carbon-rgb),.6),inset 0 0 0 1px rgba(var(--champagne-rgb),.5);max-width:calc(100% - 32px)}
.savebar .st{font-size:12px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ───── MODAL ───── */
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(var(--carbon-rgb),.45);backdrop-filter:blur(3px)}
.modal .panel{width:min(620px,100%);max-height:90vh;overflow:auto;background:var(--modal-bg)}
.modal h3{font-family:var(--f-name);font-size:28px;margin:0;color:var(--lila)}
.modal .script{font-family:var(--f-script);font-size:22px;color:var(--rosapolvo);margin:-2px 0 10px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.hist{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:6px}
.hist li{display:flex;gap:8px;align-items:center;background:#fff;border-radius:12px;padding:8px 10px;font-size:12.5px;box-shadow:inset 0 0 0 1px var(--line)}
.hist li .grow{flex:1;min-width:0}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:60;background:var(--lila);color:var(--perla);padding:10px 18px;border-radius:999px;font-weight:600;box-shadow:0 10px 24px -10px rgba(0,0,0,.5);animation:pop .25s}
@keyframes pop{from{opacity:0;transform:translate(-50%,-8px)}}
.tip{font-size:12px;background:rgba(var(--champagne-rgb),.35);border-radius:12px;padding:8px 12px;margin-top:8px;box-shadow:inset 0 0 0 1px rgba(var(--oro-rgb),.5)}

/* ───── APARIENCIA ───── */
.theme-panel{margin:-4px 0 16px}
.theme-panel>summary{list-style:none;cursor:pointer;font-weight:700;color:var(--lila);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.theme-panel>summary::-webkit-details-marker{display:none}
.theme-panel>summary .sw{width:22px;height:22px;border-radius:50%;box-shadow:0 0 0 2px #fff,0 0 0 3px var(--oro)}
.theme-grid{display:grid;grid-template-columns:170px 1fr;gap:22px;align-items:center;margin-top:14px}
.wheel{position:relative;width:160px;height:160px;border-radius:50%;cursor:crosshair;touch-action:none;

<script>
/* ════════════════ DATOS Y REGLAS ════════════════ */
const PREFIX='AVK1';
const LS_DRAFT='avk_tracker_draft', LS_HIST='avk_tracker_hist';
const DEF_RULES={R:25,N:20,L:15,J:0,I:0,M:85,C:20,D:0};
const ST={ '':'—', R:'Rápido', N:'Normal', L:'Lento', J:'Falta justificada', I:'Falta injustificada', S:'Sin postear' };
const ST_SHORT={ '':'·', R:'R', N:'N', L:'L', J:'FJ', I:'FI', S:'SP' };
const MST={ '':'—', Y:'Posteó', X:'Posteó con faltas', F:'No posteó (falta)' };
const MST_SHORT={ '':'·', Y:'✓', X:'✓+', F:'F' };
const INV_CATS=['Básico','Intermedio','Avanzado','Especial'];

const uid=()=>Math.random().toString(36).slice(2,8);
const n=v=>{const x=parseFloat(v);return isNaN(x)?0:x};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function newChar(){
  return { id:uid(), n:'', s:'', p:'', img:'', t:[],
    pp:[0,0], pr:[0,0], pd:[0,0], h:[0,0], u:'', pa:[0,0],
    v:[ {n:'💰 Recursos',l:'',u:'',m:'',d:''}, {n:'🏆 Fama',l:'',u:'',m:'',d:''},
        {n:'🎖️ Orden de Merlín',l:'',u:'',m:'',d:''}, {n:'🤝 Patrón',l:'',u:'',m:'',d:''} ],
    tr:[ {n:'',c:'',l:'',u:'',m:'',d:''} ],
    inv:[ {c:'Básico',o:'',u:'',m:'',d:''} ],
    no:'' };
}
function newTab(i){ const c=newChar(); c.t=Array(20).fill(''); return { id:uid(), n:'Tablilla '+i, nt:20, m:{n:'',t:Array(20).fill(''),f:Array(20).fill(0)}, r:{...DEF_RULES}, ch:[c] }; }
function newParty(){ return { v:1, title:'', sv:0, at:0, tb:[newTab(1)] }; }

/* normaliza datos (rellena faltantes tras decodificar) */
function normParty(p){
  const d=newParty(); p=Object.assign(d,p||{});
  if(!Array.isArray(p.tb)||!p.tb.length) p.tb=[newTab(1)];
  p.tb=p.tb.map((t,i)=>{
    const b=Object.assign(newTab(i+1),t); b.ch=[];
    b.r=Object.assign({...DEF_RULES},t.r||{});
    b.nt=Math.max(1,Math.min(60,parseInt(b.nt)||20));
    b.m=Object.assign({n:'',t:[]},t.m||{});
    b.m.t=fromT(b.m.t,b.nt); b.m.f=fromF(b.m.f,b.nt);
    b.ch=(t.ch||[]).map(c=>{
      const x=Object.assign(newChar(),c);
      ['pp','pr','pd','h','pa'].forEach(k=>{ if(!Array.isArray(x[k])) x[k]=[0,0]; });
      ['v','tr','inv'].forEach(k=>{ if(!Array.isArray(x[k])) x[k]=[]; });
      x.t=fromT(x.t,b.nt); if(!x.id) x.id=uid(); return x;
    });
    return b;
  });
  return p;
}
const fromT=(t,len)=>{ let a=Array.isArray(t)?t:(typeof t==='string'?t.split('').map(c=>c==='-'?'':c):[]); a=a.slice(0,len); while(a.length<len)a.push(''); return a; };
const fromF=(f,len)=>{ let a=Array.isArray(f)?f.map(x=>Math.max(0,parseInt(x)||0)):[]; a=a.slice(0,len); while(a.length<len)a.push(0); return a; };
const toT=a=>a.map(c=>c||'-').join('').replace(/-+$/,'');

/* ════════════════ CÁLCULOS ════════════════ */
function masterStats(tb){
  let posts=0, faltas=0;
  tb.m.t.forEach((x,i)=>{ if(x==='Y') posts++; else if(x==='X'){ posts++; faltas+=Math.max(0,parseInt(tb.m.f[i])||0); } else if(x==='F') faltas++; });
  return { posts, faltas, grageas:Math.max(0,posts*n(tb.r.M)-faltas*n(tb.r.D)) };
}
function charStats(ch,tb){
  const c=k=>ch.t.filter(x=>x===k).length;
  const R=c('R'),N=c('N'),L=c('L'),J=c('J'),I=c('I');
  const mf=masterStats(tb).faltas, r=tb.r;
  const total=R+N+L;
  const grageas=R*n(r.R)+N*n(r.N)+L*n(r.L)+J*n(r.J)+I*n(r.I)+mf*n(r.C);
  return { R,N,L,J,I,total,grageas,comp:mf*n(r.C),pct:Math.min(100,total/tb.nt*100) };
}

/* ════════════════ CODIFICAR / DECODIFICAR ════════════════ */
function compact(p){
  const strip=o=>{
    if(Array.isArray(o)) return o.map(strip);
    if(o&&typeof o==='object'){const r={};for(const k in o){if(k==='id')continue;const v=strip(o[k]);if(v===''||v===null||v===undefined)continue;r[k]=v;}return r;}
    return o;
  };
  const c=JSON.parse(JSON.stringify(p));
  c.tb.forEach(t=>{ t.m.f=(t.m.f||[]).map((x,i)=>t.m.t[i]==='X'?x:0); while(t.m.f.length&&!t.m.f[t.m.f.length-1]) t.m.f.pop(); if(!t.m.f.length) delete t.m.f; t.m.t=toT(t.m.t); t.ch.forEach(ch=>{ ch.t=toT(ch.t); }); });
  return strip(c);
}
const b64u={
  enc(bytes){let s='';for(let i=0;i<bytes.length;i+=0x8000)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');},
  dec(str){str=str.replace(/-/g,'+').replace(/_/g,'/');while(str.length%4)str+='=';const b=atob(str);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
};
async function pipe(bytes,Stream,mode){ const s=new Blob([bytes]).stream().pipeThrough(new Stream(mode)); return new Uint8Array(await new Response(s).arrayBuffer()); }
async function encodeParty(p){
  const bytes=new TextEncoder().encode(JSON.stringify(compact(p)));
  if('CompressionStream' in window){ try{ return PREFIX+'z.'+b64u.enc(await pipe(bytes,CompressionStream,'deflate-raw')); }catch(e){} }
  return PREFIX+'p.'+b64u.enc(bytes);
}
async function decodeParty(code){
  code=String(code||'').replace(/\s+/g,'');
  const h=code.indexOf('#c='); if(h>=0) code=code.slice(h+3);
  const m=code.match(/^AVK1([zp])\.([A-Za-z0-9_-]+)$/);
  if(!m) throw new Error('Formato de código no válido');
  let bytes=b64u.dec(m[2]);
  if(m[1]==='z') bytes=await pipe(bytes,DecompressionStream,'deflate-raw');
  return normParty(JSON.parse(new TextDecoder().decode(bytes)));
}
/* ════════════════ FIREBASE (Firestore vía REST, sin librerías) ════════════════ */
const FB={ apiKey:"AIzaSyCK40yLbR9jEi4LSb3UNipmuD-ExXKfPwI", projectId:"appsavada" };
const FB_URL=`https://firestore.googleapis.com/v1/projects/${FB.projectId}/databases/(default)/documents/partidas`;
const SHORT_ABC='ABCDEFGHJKMNPQRSTUVWXYZ23456789'; // sin 0/O, 1/I/L para que no se confundan
function shortId(len=6){ const a=new Uint32Array(len); crypto.getRandomValues(a); return Array.from(a,x=>SHORT_ABC[x%SHORT_ABC.length]).join(''); }
const isShort=c=>/^[A-Za-z0-9]{4,10}$/.test(c) && !/^AVK1/i.test(c);
async function fbSave(longCode){
  for(let tries=0;tries<5;tries++){
    const id=shortId();
    const r=await fetch(`${FB_URL}?documentId=${id}&key=${FB.apiKey}`,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({fields:{d:{stringValue:longCode},at:{integerValue:String(Date.now())},v:{integerValue:'1'}}})});
    if(r.ok) return id;
    if(r.status===409) continue; // ese código ya existía: probamos otro
    throw new Error('Firebase '+r.status);
  }
  throw new Error('No se pudo generar un código libre');
}
async function fbLoad(id){
  const r=await fetch(`${FB_URL}/${encodeURIComponent(id.toUpperCase())}?key=${FB.apiKey}`);
  if(r.status===404) throw new Error('Ese código no existe');
  if(!r.ok) throw new Error('Firebase '+r.status);
  const j=await r.json(); return j.fields.d.stringValue;
}
/* acepta código corto, código largo o link completo */
async function loadAny(input){
  let c=String(input||'').replace(/\s+/g,'');
  const h=c.match(/#([pc])=(.+)$/); if(h) c=h[2];
  if(isShort(c)){ const long=await fbLoad(c); return {party:await decodeParty(long), code:c.toUpperCase(), long}; }
  return {party:await decodeParty(c), code:c, long:c};
}
const linkFor=code=>baseURL()+(isShort(code)?'#p=':'#c=')+code;

/* ════════════════ APARIENCIA (temas por misión) ════════════════ */
const BASE={lila:'#60507B',amatista:'#6B62AE',lavanda:'#AD9CBC',rosapolvo:'#C59FB3',rosa:'#D6A6B9',melocoton:'#E0B9A6',
  perla:'#EDE4EB',cristal:'#8D9BCB',salvia:'#68705F',ciruela:'#5A445E'};
const METALS={
  oro:   {champagne:'#E7D0A8',oro:'#C2A27A',carbon:'#36291B',soft:'#f4e6cc',name:'Oro'},
  plata: {champagne:'#DDDFE6',oro:'#A3A8B8',carbon:'#2A2933',soft:'#eef0f4',name:'Plata'},
  rosa:  {champagne:'#EDC9BA',oro:'#C48F7C',carbon:'#3A2428',soft:'#f6e1d8',name:'Oro rosa'},
  bronce:{champagne:'#D9B98F',oro:'#9C7444',carbon:'#2E2014',soft:'#ecdcc4',name:'Bronce'}
};
const hex2rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
function rgb2hsl([r,g,b]){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,s=0,l=(mx+mn)/2;
  if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60;}return [h,s,l];}
function hsl2rgb(h,s,l){h=(((h%360)+360)%360)/360;if(s===0){const v=Math.round(l*255);return [v,v,v];}
  const q=l<.5?l*(1+s):l+s-l*s,p=2*l-q;
  const f=t=>{t=(t+1)%1;return t<1/6?p+(q-p)*6*t:t<1/2?q:t<2/3?p+(q-p)*(2/3-t)*6:p;};
  return [f(h+1/3),f(h),f(h-1/3)].map(x=>Math.round(x*255));}
const rgb2hex=a=>'#'+a.map(x=>x.toString(16).padStart(2,'0')).join('');
const BASE_H=Math.round(rgb2hsl(hex2rgb(BASE.lila))[0]);
const DEF_THEME={h:BASE_H,k:1,m:'oro',d:0};
const PRESETS=[
  {n:'Crepúsculo',h:BASE_H,k:1,m:'oro'},
  {n:'Jardín encantado',h:135,k:.85,m:'oro'},
  {n:'Océano de cristal',h:205,k:1.05,m:'plata'},
  {n:'Rosa de hadas',h:330,k:1.15,m:'rosa'},
  {n:'Vino y sangre',h:350,k:1.05,m:'bronce'},
  {n:'Otoño ámbar',h:22,k:1,m:'bronce'},
  {n:'Noche nevada',h:230,k:.35,m:'plata'},
  {n:'Veneno',h:95,k:1.2,m:'plata'},
  {n:'Misión oscura',h:352,k:.85,m:'bronce',d:1},
  {n:'Abismo',h:262,k:.8,m:'plata',d:1},
];
function genTheme(th){
  th=Object.assign({},DEF_THEME,th||{}); const dh=th.h-BASE_H, out={};
  for(const k in BASE){ const [h,s,l]=rgb2hsl(hex2rgb(BASE[k])); out[k]=rgb2hex(hsl2rgb(h+dh,Math.min(1,s*th.k),l)); }
  const mt=METALS[th.m]||METALS.oro; out.champagne=mt.champagne; out.oro=mt.oro; out.carbon=mt.carbon; out._soft=mt.soft;
  const H=BASE_H+dh;
  out['bg-deep']=rgb2hex(hsl2rgb(H,.22*Math.min(1,th.k),.075));
  out['bg-mid']=rgb2hex(hsl2rgb(H,.18*Math.min(1,th.k),.13));
  out.ink=th.d?rgb2hex(hsl2rgb(H,.2,.9)):mt.carbon;
  return out;
}
function applyTheme(th){
  const t=genTheme(th), st=document.documentElement.style;
  for(const k in t){ if(k[0]==='_') continue; st.setProperty('--'+k,t[k]); st.setProperty('--'+k+'-rgb',hex2rgb(t[k]).join(',')); }
  const pr=hex2rgb(t.perla), dark=!!(th&&th.d), lh=rgb2hsl(hex2rgb(t.lila))[0];
  document.documentElement.classList.toggle('dark',dark);
  st.setProperty('--muted',rgb2hex(hsl2rgb(lh,.12*Math.min(1,th?.k??1),dark?.68:.45)));
  st.setProperty('--champagne-soft',t._soft);
  st.setProperty('--modal-bg',dark?`rgba(${hex2rgb(t['bg-mid']).join(',')},.97)`:`rgba(${pr.map(x=>Math.min(255,x+10)).join(',')},.97)`);
  st.setProperty('--line',`rgba(${hex2rgb(t.lila).join(',')},.18)`);
}
const swatch=th=>{const t=genTheme(th);return th&&th.d?`linear-gradient(135deg,${t['bg-deep']} 30%,${t.ciruela} 60%,${t.lila} 80%,${t.champagne})`:`linear-gradient(135deg,${t.ciruela},${t.amatista} 45%,${t.rosa} 75%,${t.champagne})`;};
const sameTheme=(a,b)=>a.h===b.h&&Math.abs(a.k-b.k)<.001&&a.m===b.m&&(a.d||0)===(b.d||0);

let wheelDrag=false;
function wheelHue(e){ const w=document.getElementById('wheel'); if(!w) return; const r=w.getBoundingClientRect();
  const ang=Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2))*180/Math.PI;
  setTheme({h:Math.round((ang+90+360)%360)}); }
document.addEventListener('pointerdown',e=>{ const w=e.target.closest('#wheel'); if(w){ wheelDrag=true; try{w.setPointerCapture(e.pointerId)}catch(_){} wheelHue(e); e.preventDefault(); }});

function sealOf(code){ let h=2166136261; for(let i=0;i<code.length;i++){h^=code.charCodeAt(i);h=Math.imul(h,16777619);} return (h>>>0).toString(36).toUpperCase().slice(0,5).padStart(5,'0'); }

function imgurFix(u){
  u=String(u||'').trim(); if(!u) return '';
  const m=u.match(/^https?:\/\/(?:m\.)?imgur\.com\/([A-Za-z0-9]{5,10})$/); if(m) return 'https://i.imgur.com/'+m[1]+'.png';
  return /^https:\/\//i.test(u)?u:'';
}
function fld(edit,val,path,o={}){
  if(!edit){ const v=(val===''||val===undefined||val===null)?(o.dash??'—'):val; return `<span class="${o.vcls||''}">${esc(v)}</span>`; }
  const ph=o.ph?` placeholder="${esc(o.ph)}"`:'';
  if(o.area) return `<textarea class="in ${o.cls||''}" data-k="${path}"${ph}>${esc(val)}</textarea>`;
  return `<input class="in ${o.num?'num':''} ${o.cls||''}" ${o.num?'inputmode="decimal"':''} data-k="${path}" value="${esc(val)}"${ph}${o.num?' data-num="1"':''}>`;
}
function barHTML(pair,kind){
  const used=n(pair[0]),max=n(pair[1]);
  if(max<=0) return `<div class="fillbar"><b style="width:0"></b></div>`;
  if(max<=30){ let s=''; for(let i=0;i<max;i++) s+=`<i class="${i<used?'f':''}"></i>`; return `<div class="segs">${s}</div>`; }
  return `<div class="fillbar"><b style="width:${Math.min(100,used/max*100)}%"></b></div>`;
}
function statRow(edit,label,pair,path,kind,mode){
  // mode: 'used' → restante = max-usados ; 'cur' → actual / máx
  const used=n(pair[0]),max=n(pair[1]);
  const restTxt = mode==='used' ? `Quedan ${Math.max(0,max-used)}` : '';
  const bar=`<div class="bar ${kind}" data-calc="bar" data-p="${path}">${barHTML(pair)}</div>`;
  if(edit) return `<div class="stat"><span class="lbl">${label}</span>${fld(1,pair[0],path+'.0',{num:1})}${fld(1,pair[1],path+'.1',{num:1,ph:'máx'})}<div class="bar ${kind}" data-calc="bar" data-p="${path}" style="grid-column:1/-1">${barHTML(pair)}</div></div>`;
  return `<div style="margin-bottom:8px"><div class="vstat"><span>${label}</span><span><b>${esc(pair[0]??0)}</b> / ${esc(pair[1]||'—')}</span></div>${bar}${restTxt&&max?`<div class="rest">${restTxt}</div>`:''}</div>`;
}
function turnSel(edit,val,path,isMaster,idx){

      <h3 class="sec-title">✧ MASTER ✧</h3>
      <div class="master-row">
        <div>${edit?fld(1,tb.m.n,`tb.${ti}.m.n`,{ph:'Nombre del master'}):`<div class="mname">${esc(tb.m.n||'Master')}</div>`}</div>
        <div class="turns">${mturns}</div>
        <div class="pills" data-calc="msum" data-tb="${ti}">${masterPills(tb)}</div>
      </div>
      ${MASTER_LEGEND}
    </section>`;
  let chars=tb.ch.map((c,ci)=>({c,ci}));
  if(filter) chars=chars.filter(x=>x.c.id===filter);
  const cards=chars.map(({c,ci})=>charCard(c,tb,ti,ci,edit)).join('');
  return head+master+legendHTML(tb)+
    (cards?`<div class="grid">${cards}</div>`:`<div class="panel empty"><div class="script">Aún no hay personajes</div></div>`)+
    (edit?`<div style="text-align:center;margin-top:18px"><button class="btn dark" data-addch="${ti}">✦ Añadir personaje</button></div>`:'');
}
function tabsHTML(p,active,edit){
  return `<div class="tabs">${p.tb.map((t,i)=>`<button class="tab ${i===active?'act':''}" data-tab="${i}"><span class="dot">✦</span>${esc(t.n||'Tablilla '+(i+1))}</button>`).join('')}
    ${edit?`<button class="btn sm" data-addtab="1">+ Tablilla</button>`:''}</div>`;
}

/* ════════════════ VISTAS ════════════════ */
function nav(){
  const b=(m,txt)=>`<button class="btn ${S.mode===m?'on':''}" data-mode="${m}">${txt}</button>`;
  document.getElementById('nav').innerHTML=b('home','🌙 Inicio')+b('view','🔮 Ver con código')+b('master','🗝️ Panel de Master');
}
function heroMeta(p){
  const m=document.getElementById('heroMeta'), s=document.getElementById('heroScript');
  if(p&&(S.mode==='view'||S.mode==='master')){
    s.textContent=p.title||'Misión sin título';
    const date=p.at?new Date(p.at).toLocaleString('es-AR',{dateStyle:'medium',timeStyle:'short'}):'';
    m.innerHTML=`<div class="meta">${p.sv?`<span class="chip">✦ Guardado n.º ${p.sv}</span>`:''}${date?`<span class="chip">${esc(date)}</span>`:''}${S.mode==='view'&&S.lastViewCode?`<span class="chip">Sello ${sealOf(S.lastViewCode)}</span>`:''}</div>`;
  } else { s.textContent='Tracker de misiones encantado'; m.innerHTML=''; }
}
function render(){
  const y=window.scrollY;
  nav(); const app=document.getElementById('app');
  applyTheme(S.mode==='view'?S.view?.th:S.mode==='master'?S.party?.th:null);
  if(S.mode==='home'){ heroMeta(null); app.innerHTML=homeView(); }
  else if(S.mode==='view'){ heroMeta(S.view); app.innerHTML=viewView(); }
  else { if(!S.party) S.party=newParty(); heroMeta(S.party); app.innerHTML=masterView(); }
  window.scrollTo(0,y);
}
function homeView(){
  return `<div class="home">
    <section class="panel">
      <h2>Soy jugador/a</h2><div class="script">revisar mis recursos</div>
      <label class="f">Código de partida</label>
      <textarea class="in code-box" id="homeCode" placeholder="Escribí el código que dejó tu master (ej: X7K2P9)"></textarea>
      <div class="row"><button class="btn prime" data-load-view="homeCode">🔮 Ver tablilla</button></div>
    </section>
    <section class="panel">
      <h2>Soy master</h2><div class="script">llevar la misión</div>
      <ol>
        <li>Creá una o varias <b>tablillas</b> (escenas, grupos, rondas).</li>
        <li>Añadí los <b>personajes</b>: imagen de Imgur, turnos, puntos, ventajas, trasfondos e inventario.</li>
        <li>Al cerrar el turno tocá <b>“Guardar turno”</b>: te da un código.</li>
        <li>Publicalo en el tema: cada jugador lo pega acá y ve la tabla tal cual.</li>
      </ol>
      <div class="row"><button class="btn dark" data-mode="master">🗝️ Abrir panel de master</button></div>
    </section>
  </div>`;
}
function viewView(){
  if(!S.view) return `<section class="panel" style="max-width:620px;margin:0 auto">
      <h3 class="sec-title">✦ CÓDIGO DE PARTIDA ✦</h3>
      <textarea class="in code-box" id="viewCode" placeholder="Código de partida (ej: X7K2P9)"></textarea>
      <div class="row"><button class="btn prime" data-load-view="viewCode">🔮 Ver tablilla</button></div>
    </section>`;
  const p=S.view, t=Math.min(S.vtab,p.tb.length-1), tb=p.tb[t];
  const opts=`<option value="">Todos los personajes</option>`+tb.ch.map(c=>`<option value="${c.id}" ${S.filter===c.id?'selected':''}>${esc(c.n||'Sin nombre')}${c.p?' · '+esc(c.p):''}</option>`).join('');
  return `<div class="mbar">
      <div class="grow"><label class="f">Ver personaje</label><select class="in" id="vfilter">${opts}</select></div>
      <button class="btn sm" data-copy-link="1">🔗 Copiar link</button>
      <button class="btn sm ghost" data-clear-view="1">Otro código</button>
    </div>
    ${tabsHTML(p,t,false)}${tablilla(tb,t,false,S.filter)}`;
}
function masterView(){
  const p=S.party, t=Math.min(S.tab,p.tb.length-1);
  return `<div class="mbar panel">
      <div class="grow"><label class="f">Nombre de la misión / partida</label>${fld(1,p.title,'title',{ph:'Ej: El Eco del Imperio'})}</div>
      <button class="btn sm" data-open="load">📜 Cargar código</button>
      <button class="btn sm" data-open="hist">⏳ Guardados</button>
      <button class="btn sm ghost" data-newparty="1">Nueva partida</button>
    </div>
    ${themePanel(p)}
    ${tabsHTML(p,t,true)}${tablilla(p.tb[t],t,true,'')}
    <div class="savebar"><span class="st" id="saveSt">${dirty?'Cambios sin guardar ✎':(p.sv?'Guardado n.º '+p.sv:'Sin guardar aún')}</span>
      <button class="btn prime" data-save="1">✦ Guardar turno</button></div>`;
}

/* actualiza solo los cálculos sin re-renderizar (mantiene el foco) */
function refreshCalcs(){
  const p=S.party; if(!p) return;
  document.querySelectorAll('[data-calc]').forEach(el=>{
    const k=el.dataset.calc;
    if(k==='bar'){ el.innerHTML=barHTML(getPath(p,el.dataset.p)); }
    else if(k==='sum'){ const tb=p.tb[el.dataset.tb]; el.innerHTML=sumPills(tb.ch[el.dataset.ch],tb); }
    else if(k==='prog'){ const tb=p.tb[el.dataset.tb]; el.style.width=charStats(tb.ch[el.dataset.ch],tb).pct+'%'; }
    else if(k==='msum'){ el.innerHTML=masterPills(p.tb[el.dataset.tb]); }
  });
}

/* ════════════════ MODALES ════════════════ */
function modal(html){ document.getElementById('layer').innerHTML=`<div class="modal" data-close-bg="1"><div class="panel">${html}<div class="row" style="justify-content:flex-end"><button class="btn sm ghost" data-close="1">Cerrar</button></div></div></div>`; }
function closeModal(){ document.getElementById('layer').innerHTML=''; }
function toast(t){ const d=document.createElement('div'); d.className='toast'; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),2200); }
async function copy(txt){ try{ await navigator.clipboard.writeText(txt); toast('✦ Copiado'); }catch(e){ const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');toast('✦ Copiado')}catch(_){} ta.remove(); } }
const baseURL=()=>location.href.split('#')[0];

async function saveTurn(){
  const p=S.party; p.sv=(p.sv||0)+1; p.at=Date.now();
  const long=await encodeParty(p);
  modal(`<h3>Guardando…</h3><div class="script">sellando el turno en la bóveda</div>`);
  let short='', err='';
  try{ short=await fbSave(long); }catch(e){ err=e.message; }
  const code=short||long;
  S.lastCode=code; dirty=false; draftSave();
  const h=ls.get(LS_HIST,[]); h.unshift({code,long,at:p.at,sv:p.sv,title:p.title||'Sin título'}); ls.set(LS_HIST,h.slice(0,40));
  render();
  const link=linkFor(code);
  const bb=`[center][b]✦ Código de partida · Guardado n.º ${p.sv} ✦[/b]\n[code]${code}[/code]\n[url=${link}]Ver la tablilla[/url][/center]`;
  modal(`<h3>Turno guardado</h3><div class="script">Guardado n.º ${p.sv}</div>
    ${short?`<label class="f">Código de partida</label>
      <div class="bigcode">${esc(short)}</div>`
    :`<div class="tip" style="background:rgba(var(--rosapolvo-rgb),.3)">No se pudo conectar con la base de datos (${esc(err)}). Te dejo el <b>código largo</b>, que funciona igual sin internet.</div>
      <label class="f">Código de partida (${long.length} caracteres)</label>`}
    <textarea class="in code-box" readonly id="outCode" style="${short?'position:absolute;left:-9999px;height:1px;min-height:0':''}">${esc(code)}</textarea>
    <div class="row">
      <button class="btn prime" data-copy="outCode">Copiar código</button>
      <button class="btn sm" data-copytext="${esc(link)}">🔗 Copiar link directo</button>
      <button class="btn sm" data-copytext="${esc(bb)}">Copiar con BBCode</button>
    </div>
    ${short?`<details class="rules" style="margin-top:12px"><summary>Código largo de respaldo</summary>
      <textarea class="in code-box" readonly style="margin-top:8px">${esc(long)}</textarea>
      <div class="muted">Funciona aunque Firebase esté caído: lleva toda la partida adentro.</div></details>`:''}
    <div class="tip">Cada guardado crea un código nuevo y <b>nadie puede modificarlo</b>. Si cambiás algo, guardá otra vez y publicá el código nuevo.</div>`);
}
function loadModal(){
  modal(`<h3>Cargar código</h3><div class="script">retomar desde un guardado</div>
    <textarea class="in code-box" id="loadCode" placeholder="Código corto o largo"></textarea>
    <div class="tip">Reemplaza lo que tengas abierto en el panel (tu borrador actual se pierde si no lo guardaste).</div>
    <div class="row"><button class="btn prime" data-load-master="loadCode">Cargar en el panel</button></div>`);
}
function histModal(){
  const h=ls.get(LS_HIST,[]);
  const items=h.length?h.map((x,i)=>`<li><div class="grow"><b>${esc(x.title)}</b> · n.º ${x.sv}<div class="muted">${new Date(x.at).toLocaleString('es-AR')} · sello ${sealOf(x.code)}</div></div>
      <button class="btn sm" data-hcopy="${i}">Copiar</button><button class="btn sm dark" data-hload="${i}">Abrir</button></li>`).join(''):'<li>Aún no guardaste turnos en este navegador.</li>';
  modal(`<h3>Guardados</h3><div class="script">historial de este navegador</div><ul class="hist">${items}</ul>`);
}

/* ════════════════ EVENTOS ════════════════ */
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='themeK'&&S.mode==='master'){ setTheme({k:+el.value}); return; }
  if(S.mode!=='master'||!el.dataset.k) return;
  let v=el.value; if(el.dataset.num) v=v.trim()===''?'':(isNaN(+v)?v:+v);
  setPath(S.party,el.dataset.k,v);
  if(el.dataset.turn==='m'){ const [,ti,,,i]=el.dataset.k.split('.'); const tb=S.party.tb[ti];
    if(v==='X'&&!(tb.m.f[i]>0)) tb.m.f[i]=1; markDirty(); render(); return; }
  if(el.dataset.fcnt!==undefined){ const nf=Math.max(0,parseInt(el.value)||0); setPath(S.party,el.dataset.k,nf);
    const w=el.previousElementSibling; if(w){ w.firstChild.textContent='✓'+nf; w.title='Posteó con '+nf+' faltas'; } }
  if(el.dataset.turn){ const w=el.parentElement, m=el.dataset.turn==='m'; w.className='tsel st-'+(v||'_');
    w.firstChild.textContent=(m?MST_SHORT:ST_SHORT)[v]||'·'; w.title='Turno: '+((m?MST:ST)[v]||'—'); }
  markDirty(); refreshCalcs();
  if(el.dataset.k==='title') heroMeta(S.party);
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='vfilter'){ S.filter=el.value; render(); return; }
  if(el.dataset.nt!==undefined){ const tb=S.party.tb[el.dataset.nt]; tb.nt=Math.max(1,Math.min(60,parseInt(el.value)||20));
    tb.m.t=fromT(tb.m.t,tb.nt); tb.m.f=fromF(tb.m.f,tb.nt); tb.ch.forEach(c=>c.t=fromT(c.t,tb.nt)); markDirty(); render(); }
  if(S.mode==='master'&&el.dataset.k&&/^tb\.\d+\.n$|\.img$/.test(el.dataset.k)) render(); // imagen / nombre de pestaña
});
document.addEventListener('click',async e=>{
  const b=e.target.closest('button,[data-close-bg]'); if(!b) return;
  const d=b.dataset;
  if(d.closeBg!==undefined){ if(e.target===b) closeModal(); return; }
  if(d.close){ closeModal(); return; }
  if(d.mode){ S.mode=d.mode; if(d.mode==='view'&&!S.view) S.filter=''; render(); window.scrollTo(0,0); return; }
  if(d.tab!==undefined){ if(S.mode==='view'){S.vtab=+d.tab;S.filter='';} else S.tab=+d.tab; render(); return; }
  if(d.loadView){ const code=document.getElementById(d.loadView).value; b.disabled=true; try{ const r=await loadAny(code); S.view=r.party; S.lastViewCode=r.code; S.vtab=0; S.filter=''; S.mode='view'; history.replaceState(null,'',linkFor(r.code)); render(); }catch(err){ b.disabled=false; toast(err.message==='Ese código no existe'?'Ese código no existe ✧ revisalo':'Código no válido ✧ revisá que esté completo'); } return; }
  if(d.clearView){ S.view=null; S.lastViewCode=''; history.replaceState(null,'',baseURL()); render(); return; }
  if(d.copyLink){ copy(linkFor(S.lastViewCode)); return; }
  if(d.save){ saveTurn(); return; }
  if(d.open==='load'){ loadModal(); return; }
  if(d.open==='hist'){ histModal(); return; }
  if(d.copy){ copy(document.getElementById(d.copy).value); return; }
  if(d.copytext){ copy(d.copytext); return; }
  if(d.loadMaster){ try{ S.party=(await loadAny(document.getElementById(d.loadMaster).value)).party; S.tab=0; dirty=false; draftSave(); closeModal(); render(); toast('✦ Partida cargada'); }catch(err){ toast('Código no válido'); } return; }
  if(d.hcopy!==undefined){ copy(ls.get(LS_HIST,[])[d.hcopy].code); return; }
  if(d.hload!==undefined){ const x=ls.get(LS_HIST,[])[d.hload]; S.party=await decodeParty(x.long||x.code); S.lastCode=x.code; S.tab=0; dirty=false; draftSave(); closeModal(); render(); toast('✦ Guardado n.º '+x.sv+' abierto'); return; }
  if(d.newparty){ if(confirmInline(b,'¿Seguro? Toca otra vez')){ S.party=newParty(); S.tab=0; dirty=false; draftSave(); render(); } return; }
  if(S.mode!=='master') return;
  const p=S.party;
  if(d.preset!==undefined){ const x=PRESETS[d.preset]; setTheme({h:x.h,k:x.k,m:x.m,d:x.d||0}); return; }
  if(d.dark!==undefined){ setTheme({d:+d.dark}); return; }
  if(d.metal){ setTheme({m:d.metal}); return; }
  if(d.addtab){ p.tb.push(newTab(p.tb.length+1)); S.tab=p.tb.length-1; markDirty(); render(); return; }
  if(d.deltab!==undefined){ if(p.tb.length<2){toast('Tiene que quedar al menos una tablilla');return;} if(confirmInline(b,'¿Eliminar? Toca otra vez')){ p.tb.splice(+d.deltab,1); S.tab=0; markDirty(); render(); } return; }
  if(d.addch!==undefined){ const tb=p.tb[d.addch]; const c=newChar(); c.t=fromT([],tb.nt); tb.ch.push(c); markDirty(); render(); return; }
  if(d.delch){ if(confirmInline(b,'¿Eliminar? Toca otra vez')){ const [ti,ci]=d.delch.split('.').map(Number); p.tb[ti].ch.splice(ci,1); markDirty(); render(); } return; }
  if(d.dup){ const [ti,ci]=d.dup.split('.').map(Number); const c=JSON.parse(JSON.stringify(p.tb[ti].ch[ci])); c.id=uid(); c.n=(c.n||'Personaje')+' (copia)'; p.tb[ti].ch.splice(ci+1,0,c); markDirty(); render(); return; }
  if(d.add){ const arr=getPath(p,d.p+'.'+d.add);
    arr.push(d.add==='inv'?{c:arr.length?arr[arr.length-1].c:'Básico',o:'',u:'',m:'',d:''}:d.add==='tr'?{n:'',c:'',l:'',u:'',m:'',d:''}:{n:'',l:'',u:'',m:'',d:''});
    markDirty(); render(); return; }
  if(d.del){ getPath(p,d.del).splice(+d.i,1); markDirty(); render(); return; }
});
function confirmInline(btn,msg){ if(btn.dataset.armed){ return true; } btn.dataset.armed='1'; const o=btn.textContent; btn.textContent=msg; setTimeout(()=>{ if(btn.isConnected){btn.textContent=o; delete btn.dataset.armed;} },2500); return false; }
window.addEventListener('beforeunload',e=>{ if(dirty&&S.mode==='master'){ e.preventDefault(); e.returnValue=''; } });

/* ════════════════ INICIO ════════════════ */
(async function init(){
  const dr=ls.get(LS_DRAFT,null);
  if(dr&&dr.party){ try{ S.party=normParty(dr.party); S.lastCode=dr.lastCode||''; }catch(e){} }
  const h=location.hash;
  if(/^#[pc]=/.test(h)){
    S.mode='view'; render();
    try{ const r=await loadAny(h); S.view=r.party; S.lastViewCode=r.code; }catch(e){ toast('El link tiene un código no válido'); }
  }
  render();
})();
</script>
