<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PMA · Plataforma de Masters Avadenses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Cinzel:wght@500;600;700&family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Pinyon+Script&family=Quicksand:wght@400;500;600;700&family=Nunito:wght@400;600;700&family=IM+Fell+English+SC&family=IM+Fell+DW+Pica:ital@0;1&family=IM+Fell+Double+Pica:ital@0;1&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">
<style>
:root{
  --lila:#60507B; --amatista:#6B62AE; --lavanda:#AD9CBC; --rosapolvo:#C59FB3;
  --rosa:#D6A6B9; --melocoton:#E0B9A6; --perla:#EDE4EB; --champagne:#E7D0A8;
  --oro:#C2A27A; --cristal:#8D9BCB; --salvia:#68705F; --ciruela:#5A445E; --carbon:#36291B;
  --f-title:'Cinzel Decorative',serif; --f-name:'Cormorant Garamond',serif;
  --f-script:'Allura',cursive; --f-body:'Quicksand',sans-serif;
  --glass:rgba(255,255,255,.55); --line:rgba(var(--lila-rgb),.18);
  --radius:18px;
  --lila-rgb:96,80,123; --amatista-rgb:107,98,174; --lavanda-rgb:173,156,188; --rosapolvo-rgb:197,159,179;
  --rosa-rgb:214,166,185; --perla-rgb:237,228,235; --champagne-rgb:231,208,168; --oro-rgb:194,162,122;
  --cristal-rgb:141,155,203; --ciruela-rgb:90,68,94; --carbon-rgb:54,41,27;
  --muted:#7a6a80; --ink:#36291B; --modal-bg:rgba(247,241,246,.97); --champagne-soft:#f4e6cc;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:var(--f-body); color:var(--ink); font-size:14px; line-height:1.45;
  background:
    radial-gradient(1px 1px at 12% 18%,#fff 60%,transparent 61%),
    radial-gradient(1px 1px at 72% 8%,#fff 60%,transparent 61%),
    radial-gradient(1.5px 1.5px at 40% 60%,rgba(var(--champagne-rgb),.9) 60%,transparent 61%),
    radial-gradient(1px 1px at 88% 44%,#fff 60%,transparent 61%),
    radial-gradient(1px 1px at 25% 82%,#fff 60%,transparent 61%),
    radial-gradient(900px 600px at 0% 0%,rgba(var(--lavanda-rgb),.55),transparent 60%),
    radial-gradient(800px 600px at 100% 10%,rgba(var(--rosa-rgb),.45),transparent 60%),
    radial-gradient(900px 700px at 50% 100%,rgba(var(--cristal-rgb),.40),transparent 60%),
    var(--perla);
  background-attachment:fixed; min-height:100vh;
}
::selection{background:var(--rosa);color:var(--carbon)}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px 120px}

/* ───── HEADER ───── */
.hero{
  position:relative; margin:18px auto 22px; padding:30px 22px 26px; text-align:center;
  border-radius:26px; color:var(--perla); overflow:hidden;
  background:
    radial-gradient(500px 200px at 20% 0%,rgba(var(--amatista-rgb),.75),transparent 70%),
    radial-gradient(500px 220px at 85% 100%,rgba(var(--rosapolvo-rgb),.55),transparent 70%),
    linear-gradient(135deg,var(--ciruela),var(--lila) 55%,var(--amatista));
  box-shadow:0 18px 40px -18px rgba(var(--ciruela-rgb),.7), inset 0 0 0 1px rgba(var(--champagne-rgb),.55), inset 0 0 0 6px rgba(255,255,255,.04), inset 0 0 0 7px rgba(var(--oro-rgb),.45);
}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:
   radial-gradient(1.5px 1.5px at 10% 30%,#fff,transparent 60%),
   radial-gradient(1px 1px at 30% 70%,#fff,transparent 60%),
   radial-gradient(2px 2px at 62% 22%,var(--champagne),transparent 60%),
   radial-gradient(1px 1px at 78% 66%,#fff,transparent 60%),
   radial-gradient(1.5px 1.5px at 92% 26%,#fff,transparent 60%),
   radial-gradient(1px 1px at 50% 88%,var(--champagne),transparent 60%);
  animation:twinkle 5s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.45}to{opacity:1}}
.hero h1{font-family:var(--f-title);font-weight:700;letter-spacing:.06em;margin:0;font-size:clamp(22px,4vw,38px);
  background:linear-gradient(90deg,var(--champagne),#fff 40%,var(--rosa) 70%,var(--champagne));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .script{font-family:var(--f-script);font-size:clamp(22px,3vw,32px);color:var(--rosa);margin-top:2px}
.hero .moon{position:absolute;top:16px;left:22px;width:44px;opacity:.9}
.hero .bfly{position:absolute;width:54px;opacity:.9;animation:flut 4s ease-in-out infinite}
.hero .bfly.a{right:26px;top:14px}
.hero .bfly.b{left:18%;bottom:6px;width:34px;animation-delay:-1.6s;opacity:.7}
@keyframes flut{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-6px) rotate(4deg)}}
.nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}

/* ───── BUTTONS ───── */
.btn{border:0;cursor:pointer;border-radius:999px;padding:9px 18px;font-weight:600;letter-spacing:.02em;
  background:rgba(255,255,255,.7);color:var(--lila);box-shadow:inset 0 0 0 1px rgba(var(--oro-rgb),.6);transition:.2s}
.btn:hover{background:#fff;transform:translateY(-1px)}
.btn.prime{color:var(--carbon);background:linear-gradient(135deg,var(--champagne),var(--melocoton) 50%,var(--rosa));box-shadow:0 6px 18px -8px rgba(var(--lila-rgb),.8),inset 0 0 0 1px rgba(255,255,255,.7)}
.btn.dark{background:linear-gradient(135deg,var(--lila),var(--amatista));color:var(--perla);box-shadow:inset 0 0 0 1px rgba(var(--champagne-rgb),.6)}
.btn.ghost{background:transparent;color:inherit;box-shadow:inset 0 0 0 1px currentColor;opacity:.85}
.btn.sm{padding:5px 12px;font-size:12px}
.btn.on{background:var(--champagne);color:var(--carbon)}
.x{border:0;background:transparent;cursor:pointer;color:var(--rosapolvo);font-size:16px;line-height:1;padding:2px 6px;border-radius:8px}
.x:hover{background:rgba(var(--rosapolvo-rgb),.2);color:var(--ciruela)}

/* ───── GLASS PANELS ───── */
.panel{position:relative;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-radius:var(--radius);padding:18px;box-shadow:0 10px 30px -18px rgba(var(--ciruela-rgb),.55),inset 0 0 0 1px rgba(255,255,255,.8),inset 0 0 0 2px rgba(var(--oro-rgb),.25)}
.sec-title{font-family:var(--f-title);font-size:13px;letter-spacing:.18em;color:var(--lila);text-align:center;margin:0 0 10px;display:flex;align-items:center;gap:10px}
.sec-title::before,.sec-title::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--oro),transparent)}
.muted{color:var(--muted);font-size:12px}

/* ───── HOME ───── */
.home{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;margin-top:10px}
.home .panel h2{font-family:var(--f-name);font-size:28px;margin:0;color:var(--lila)}
.home .panel .script{font-family:var(--f-script);font-size:24px;color:var(--rosapolvo);margin:-4px 0 10px}
.home ol{padding-left:18px;margin:8px 0 0}
.home li{margin:4px 0}

/* ───── INPUTS ───── */
.in{width:100%;border:0;border-radius:10px;padding:6px 9px;background:rgba(255,255,255,.75);box-shadow:inset 0 0 0 1px var(--line);outline:none;transition:.15s}
.in:focus{box-shadow:inset 0 0 0 2px var(--cristal);background:#fff}
.in.num{text-align:center;padding:6px 4px;-moz-appearance:textfield}
.in.num::-webkit-inner-spin-button{opacity:.4}
textarea.in{resize:vertical;min-height:60px}
.code-box{width:100%;text-transform:none;font-family:ui-monospace,Menlo,monospace;font-size:12px;word-break:break-all;min-height:110px}
label.f{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--lila);margin:0 0 4px}

/* ───── MISSION BAR ───── */
.mbar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:14px}
.mbar .grow{flex:1;min-width:220px}
.meta{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.18);box-shadow:inset 0 0 0 1px rgba(var(--champagne-rgb),.5)}

/* ───── TABS ───── */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 16px;align-items:center}
.tab{border:0;cursor:pointer;padding:9px 18px;border-radius:14px 14px 4px 4px;font-family:var(--f-name);font-size:17px;font-weight:700;
  background:rgba(255,255,255,.45);color:var(--lila);box-shadow:inset 0 -2px 0 rgba(var(--oro-rgb),.4)}
.tab.act{background:linear-gradient(180deg,#fff,rgba(var(--perla-rgb),.9));color:var(--ciruela);box-shadow:inset 0 -3px 0 var(--amatista),0 6px 14px -10px var(--lila)}
.tab .dot{color:var(--oro);margin-right:4px}

/* ───── TABLILLA ───── */
.tb-head{display:grid;grid-template-columns:1fr 130px;gap:12px;align-items:end;margin-bottom:12px}
.rules{margin-top:10px}
.rules summary{cursor:pointer;font-weight:700;color:var(--lila);font-size:13px}
.rules-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:10px}

/* master strip */
.master{margin-bottom:18px;background:linear-gradient(135deg,rgba(var(--lila-rgb),.92),rgba(var(--amatista-rgb),.88));color:var(--perla)}
.master .sec-title{color:var(--champagne)}
.master .in{background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 1px rgba(var(--champagne-rgb),.4);color:var(--perla)}
.master .in::placeholder{color:rgba(var(--perla-rgb),.6)}
.master-row{display:grid;grid-template-columns:220px 1fr auto;gap:14px;align-items:center}
.mname{font-family:var(--f-name);font-size:22px;font-weight:700}

/* turn chips */
.turns{display:flex;flex-wrap:wrap;gap:5px}
.tcell{display:flex;flex-direction:column;align-items:center;gap:2px}
.tcell small{font-size:9px;font-weight:700;letter-spacing:.06em;opacity:.7}
.tsel{appearance:none;-webkit-appearance:none;border:0;cursor:pointer;width:34px;height:30px;border-radius:9px;text-align:center;text-align-last:center;font-weight:700;font-size:12px;padding:0}
span.tsel{display:inline-flex;align-items:center;justify-content:center;cursor:default}
label.tsel{position:relative;display:inline-flex;align-items:center;justify-content:center;transition:transform .15s}
label.tsel:hover{transform:translateY(-1px)}
label.tsel select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:14px}
.st-_{background:rgba(255,255,255,.55);color:var(--lavanda);box-shadow:inset 0 0 0 1px var(--line)}
.st-R{background:var(--salvia);color:#fff}
.st-N{background:var(--cristal);color:#fff}
.st-L{background:var(--melocoton);color:var(--carbon)}
.st-J{background:var(--champagne);color:var(--carbon);box-shadow:inset 0 0 0 1px var(--oro)}
.st-I{background:var(--ciruela);color:var(--rosa)}
.st-S{background:var(--perla);color:var(--rosapolvo);box-shadow:inset 0 0 0 1px var(--rosapolvo)}
.st-Y{background:var(--champagne);color:var(--carbon)}
.st-F{background:var(--rosapolvo);color:#fff}
.st-X{background:var(--champagne);color:var(--carbon);box-shadow:inset 0 -4px 0 var(--rosapolvo)}
.fcnt{width:34px;height:20px;margin-top:2px;border:0;border-radius:6px;text-align:center;font-size:11px;font-weight:700;padding:0;background:rgba(255,255,255,.9);color:var(--carbon);box-shadow:inset 0 0 0 1px var(--rosapolvo);-moz-appearance:textfield}
.fcnt::-webkit-inner-spin-button{opacity:1;height:16px}
.mlegend{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center;font-size:11.5px;margin-top:12px;opacity:.9}
.mlegend span{display:inline-flex;align-items:center;gap:6px}
.mlegend i{font-style:normal;font-size:10px;font-weight:700;min-width:22px;height:18px;padding:0 4px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center}
.master .st-_{background:rgba(255,255,255,.12);color:rgba(var(--perla-rgb),.55);box-shadow:inset 0 0 0 1px rgba(var(--champagne-rgb),.35)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12px;margin:2px 0 16px;justify-content:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:5px;display:inline-block}

/* pills */
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.7);box-shadow:inset 0 0 0 1px rgba(var(--oro-rgb),.5);white-space:nowrap}
.pill.gold{background:linear-gradient(135deg,var(--champagne),var(--champagne-soft));color:var(--carbon)}
.master .pill{background:rgba(255,255,255,.14);color:var(--perla);box-shadow:inset 0 0 0 1px rgba(var(--champagne-rgb),.5)}
.master .pill.gold{background:var(--champagne);color:var(--carbon)}

/* progress */
.prog{height:8px;border-radius:99px;background:rgba(var(--lila-rgb),.12);overflow:hidden;margin-top:8px}
.prog>b{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--amatista),var(--rosa),var(--champagne));transition:width .3s}

/* ───── CHARACTER CARD ───── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,560px),1fr));gap:20px}
.card{padding:0;overflow:hidden}
.card-top{display:grid;grid-template-columns:150px 1fr;gap:16px;padding:18px;position:relative;
  background:linear-gradient(135deg,rgba(var(--lavanda-rgb),.45),rgba(var(--rosa-rgb),.35) 50%,rgba(var(--cristal-rgb),.35))}
.card-top .bfly{position:absolute;right:14px;bottom:10px;width:34px;opacity:.75;animation:flut 5s ease-in-out infinite}
.portrait{width:150px;height:200px;border-radius:75px 75px 12px 12px;overflow:hidden;position:relative;
  background:linear-gradient(160deg,var(--lavanda),var(--rosa));
  box-shadow:0 0 0 3px #fff,0 0 0 5px var(--oro),0 12px 24px -12px rgba(var(--ciruela-rgb),.8)}
.portrait img{width:100%;height:100%;object-fit:cover;display:block}
.portrait .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;font-size:11px;padding:10px;gap:4px}
.portrait .ph svg{width:40px;opacity:.85}
.who .cname{font-family:var(--f-name);font-size:30px;font-weight:700;line-height:1.05;color:var(--ciruela)}
.who .csub{font-family:var(--f-script);font-size:24px;color:var(--lila);line-height:1.1;margin:2px 0 4px}
.who .cplayer{font-size:12px;font-weight:600;color:var(--salvia);margin-bottom:10px}
.who .in{margin-bottom:6px}
.who .in.name{font-family:var(--f-name);font-size:22px;font-weight:700}
.who .in.sub{font-family:var(--f-script);font-size:20px}
.card-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:14px}
.block{background:rgba(255,255,255,.5);border-radius:14px;padding:12px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.9)}
.block h4{margin:0 0 8px;font-family:var(--f-title);font-size:11.5px;letter-spacing:.14em;color:var(--lila);display:flex;align-items:center;gap:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* stat rows */
.stat{display:grid;grid-template-columns:1fr 56px 56px;gap:6px;align-items:center;margin-bottom:6px}
.stat .lbl{font-size:12.5px;font-weight:600}
.stat .bar{grid-column:1/-1;margin-top:-2px}
.vstat{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;font-weight:600;margin-bottom:2px}
.vstat b{font-family:var(--f-name);font-size:18px;color:var(--ciruela)}
.segs{display:flex;gap:2px;flex-wrap:wrap}
.segs i{flex:1;min-width:6px;max-width:22px;height:9px;border-radius:3px;background:rgba(var(--lavanda-rgb),.28);box-shadow:inset 0 0 0 1px rgba(var(--lila-rgb),.08)}
.segs i.f{background:linear-gradient(180deg,var(--rosa),var(--amatista))}
.fillbar{height:9px;border-radius:99px;background:rgba(var(--lavanda-rgb),.28);overflow:hidden}
.fillbar b{display:block;height:100%;background:linear-gradient(90deg,var(--amatista),var(--rosa))}
.bar.heal .segs i.f,.bar.heal .fillbar b{background:linear-gradient(180deg,var(--rosapolvo),var(--ciruela))}
.bar.pa .segs i.f,.bar.pa .fillbar b{background:linear-gradient(180deg,var(--champagne),var(--oro))}
.rest{font-size:10.5px;color:var(--muted);text-align:right;margin-top:1px}

/* collapsible */
details.fold{background:rgba(255,255,255,.5);border-radius:14px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.9)}
details.fold>summary{list-style:none;cursor:pointer;padding:11px 12px;font-family:var(--f-title);font-size:11.5px;letter-spacing:.14em;color:var(--lila);display:flex;align-items:center;gap:8px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"✦";margin-left:auto;color:var(--oro);transition:.25s}
details.fold[open]>summary::after{transform:rotate(45deg)}
details.fold .cnt{font-family:var(--f-body);font-size:11px;letter-spacing:0;background:var(--perla);color:var(--lila);padding:1px 8px;border-radius:99px}
.fold-in{padding:0 12px 12px}
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:separate;border-spacing:0 4px;font-size:12.5px}
table.t th{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--lila);text-align:left;padding:0 4px;font-weight:700}
table.t td{padding:0 3px;vertical-align:middle}
table.t.view td{background:rgba(255,255,255,.65);padding:6px 8px}
table.t.view td:first-child{border-radius:9px 0 0 9px}
table.t.view td:last-child{border-radius:0 9px 9px 0}
table.t .c-num{width:58px;text-align:center}
table.t .c-x{width:26px}
.catrow td{font-family:var(--f-name);font-weight:700;font-size:15px;color:var(--ciruela);padding-top:8px!important;background:transparent!important}
.notes{white-space:pre-wrap;font-size:13px}
.addrow{margin-top:6px}
.card-foot{display:flex;gap:8px;justify-content:flex-end;padding:0 18px 16px}
.empty{text-align:center;padding:40px 20px}
.empty .script{font-family:var(--f-script);font-size:30px;color:var(--rosapolvo)}

/* ───── SAVE BAR ───── */
.savebar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:20;display:flex;gap:8px;align-items:center;
  padding:8px 8px 8px 16px;border-radius:999px;background:rgba(var(--ciruela-rgb),.92);backdrop-filter:blur(8px);color:var(--perla);
  box-shadow:0 14px 34px -12px rgba(var(--carbon-rgb),.6),inset 0 0 0 1px rgba(var(--champagne-rgb),.5);max-width:calc(100% - 32px)}
.savebar .st{font-size:12px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ───── MODAL ───── */
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(var(--carbon-rgb),.45);backdrop-filter:blur(3px)}
.modal .panel{width:min(620px,100%);max-height:90vh;overflow:auto;background:var(--modal-bg)}
.modal h3{font-family:var(--f-name);font-size:28px;margin:0;color:var(--lila)}
.modal .script{font-family:var(--f-script);font-size:22px;color:var(--rosapolvo);margin:-2px 0 10px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.hist{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:6px}
.hist li{display:flex;gap:8px;align-items:center;background:#fff;border-radius:12px;padding:8px 10px;font-size:12.5px;box-shadow:inset 0 0 0 1px var(--line)}
.hist li .grow{flex:1;min-width:0}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:60;background:var(--lila);color:var(--perla);padding:10px 18px;border-radius:999px;font-weight:600;box-shadow:0 10px 24px -10px rgba(0,0,0,.5);animation:pop .25s}
@keyframes pop{from{opacity:0;transform:translate(-50%,-8px)}}
.tip{font-size:12px;background:rgba(var(--champagne-rgb),.35);border-radius:12px;padding:8px 12px;margin-top:8px;box-shadow:inset 0 0 0 1px rgba(var(--oro-rgb),.5)}

/* ───── ACONTECIMIENTO ───── */
.evtoggle{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:4px 0 6px}
.evtoggle label.f{margin:0}
label.chk{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;cursor:pointer}
label.chk input{width:16px;height:16px;accent-color:var(--amatista)}
.evsum{margin-top:14px;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1px rgba(var(--champagne-rgb),.35)}
.evhead{font-family:var(--f-title);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--champagne);margin-bottom:6px}
.evrow{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:5px 0;border-bottom:1px dashed rgba(var(--champagne-rgb),.25);font-size:13px}
.evrow:last-of-type{border-bottom:0}
.evrow small{display:block;font-size:11px;opacity:.75;font-weight:400}
.evrow b{white-space:nowrap;color:var(--champagne)}
.evwarn{margin-top:8px;font-size:12.5px;font-weight:600;padding:6px 10px;border-radius:8px;background:rgba(var(--rosapolvo-rgb),.35)}
.evctl{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.evctl select.in{width:auto;min-width:130px}
.st-Z{background:transparent;color:var(--champagne);box-shadow:inset 0 0 0 1.5px var(--champagne)}
.skin-chef .evsum{background:rgba(251,247,239,.12)}
.skin-dk .evsum{background:var(--sk-meta);box-shadow:inset 0 0 0 1px var(--sk-border2)}
.skin-dk .evhead,.skin-dk .evrow b{color:var(--sk-accent);font-family:var(--f-label)}
.skin-dk .evrow{border-bottom-color:var(--sk-border2);color:var(--sk-text)}

/* ───── PESTAÑAS DEL PANEL ───── */
.mtabs{display:flex;gap:8px;margin:0 0 14px;flex-wrap:wrap}
.mtab{border:0;cursor:pointer;flex:1;min-width:150px;padding:12px 18px;border-radius:14px;font-family:var(--f-title);font-size:14px;letter-spacing:.14em;
  background:rgba(255,255,255,.45);color:var(--lila);box-shadow:inset 0 0 0 1px var(--line);transition:.2s}
.mtab:hover{background:rgba(255,255,255,.7)}
.mtab.act{background:linear-gradient(135deg,var(--lila),var(--amatista));color:var(--perla);box-shadow:0 10px 22px -14px var(--lila)}
.dark .mtab{background:rgba(255,255,255,.05);color:var(--lavanda)}
.dark .mtab.act{background:linear-gradient(135deg,var(--ciruela),var(--lila));color:var(--champagne)}
.skin-chef .mtab{font-family:'Cinzel',serif;font-size:12px;letter-spacing:.22em;text-transform:uppercase;background:#FBF7EF;color:var(--muted);border-radius:10px}
.skin-chef .mtab.act{background:var(--lila);color:#FBF7EF}
.skin-dk .mtab{font-family:var(--f-title);font-size:12px;letter-spacing:.22em;text-transform:uppercase;background:var(--sk-panel);color:var(--sk-sub);box-shadow:inset 0 0 0 1px var(--sk-border2);border-radius:6px}
.skin-dk .mtab.act{background:var(--sk-panel2);color:var(--sk-accent);box-shadow:inset 0 -2px 0 var(--sk-accent),inset 0 0 0 1px var(--sk-border)}

/* ───── EL DADO ───── */
.dice{margin:0 0 18px}
.dice-sum{font-family:var(--f-title);font-size:14px;letter-spacing:.18em;color:var(--lila);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dice-sum .muted{font-family:var(--f-body);letter-spacing:0;font-size:12px}
.dice-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px 12px;margin-top:14px;align-items:end}
.dice-grid .span2{grid-column:span 2}.dice-grid .span3{grid-column:span 3}
.modrow{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.dice-prev{margin-top:12px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.55);box-shadow:inset 0 0 0 1px var(--line);font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
.dice-act{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:12px}
.die{width:58px;height:58px;display:flex;align-items:center;justify-content:center;font-family:var(--f-name);font-size:30px;font-weight:700;color:#fff;
  background:linear-gradient(135deg,var(--amatista),var(--lila));clip-path:polygon(50% 0,100% 38%,82% 100%,18% 100%,0 38%);box-shadow:0 8px 18px -8px var(--lila)}
.die.rolling{animation:shake .12s linear infinite}
@keyframes shake{0%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}100%{transform:rotate(-8deg)}}
.dice-res{padding:8px 14px;border-radius:12px;font-weight:700}
.dice-res b{font-family:var(--f-name);font-size:22px;margin-right:4px}
.dice-res.ok{background:rgba(104,112,95,.18);color:var(--salvia)}
.dice-res.ko{background:rgba(var(--rosapolvo-rgb),.25);color:var(--ciruela)}
.dice-lock{padding:14px 0}
.lg{max-height:420px;overflow:auto;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.55);box-shadow:inset 0 0 0 1px var(--line);font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
.lg-h{font-weight:700;margin:10px 0 4px;letter-spacing:.06em}.lg-h:first-child{margin-top:0}
.lg-l{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;padding:3px 0;border-bottom:1px dashed var(--line)}
.lg-l .x{flex:none}
.atr-block .hab-grid{margin-top:4px}
.atr-sum{display:flex;flex-wrap:wrap;gap:4px 8px;font-family:var(--f-body);font-size:11px;letter-spacing:0;text-transform:none;font-weight:600;color:var(--ink);opacity:.85;margin-left:6px}
.atr-sum .am{color:var(--rosapolvo)}
.hab-av{margin-left:auto;font-family:var(--f-name);font-size:14px;color:var(--ink);opacity:.8}
.atr-block .hab-h{display:flex;align-items:baseline}
.atr-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:12px}
.atr-grid label.f{font-size:9px;letter-spacing:.04em}
.hab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px 14px}
.hab-h{font-weight:700;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--lila);margin-bottom:4px}
.hab-r{display:flex;justify-content:space-between;gap:6px;align-items:center;font-size:12.5px;margin-bottom:3px}
.hab-r select.in{width:118px;padding:3px 6px;font-size:12px}
.atr-view{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:10px;text-align:center}
.atr-view span{background:rgba(255,255,255,.6);border-radius:8px;padding:4px 2px;box-shadow:inset 0 0 0 1px var(--line)}
.atr-view small{display:block;font-size:9px;letter-spacing:.04em;opacity:.8}.atr-view b{font-family:var(--f-name);font-size:18px}
.hab-view{display:flex;flex-wrap:wrap;gap:6px}
.hab-view span{font-size:12px;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.6);box-shadow:inset 0 0 0 1px var(--line)}
@media (max-width:760px){.dice-grid{grid-template-columns:repeat(2,1fr)}.dice-grid>div{grid-column:span 2!important}.atr-grid,.atr-view{grid-template-columns:repeat(4,1fr)}}
.dark .dice-prev,.dark .lg,.dark .atr-view span,.dark .hab-view span{background:rgba(255,255,255,.05)}
.skin-dk .dice-prev,.skin-dk .lg{background:var(--sk-meta);box-shadow:inset 0 0 0 1px var(--sk-border2);color:var(--sk-text)}
.skin-dk .die{background:linear-gradient(135deg,var(--sk-panel2),var(--sk-border));color:var(--sk-accent)}
.skin-dk .dice-sum,.skin-dk .hab-h{color:var(--sk-accent);font-family:var(--f-title)}
.skin-chef .dice-prev,.skin-chef .lg{background:#F5EDDD}
.skin-dk .dice-res.ok,.dark .dice-res.ok{background:rgba(var(--rosa-rgb),.14);color:var(--rosa)}
.skin-dk .dice-res.ko,.dark .dice-res.ko{background:rgba(var(--rosapolvo-rgb),.35);color:var(--perla)}
.skin-dk .dice-res.ok{color:var(--sk-name)}
.skin-chef .die{background:linear-gradient(135deg,#B05E3E,#8E4A30)}

.dice-ev{margin:12px 0 0;font-weight:500}
.dice-top{display:flex;gap:22px;align-items:center;margin:14px 0 6px;flex-wrap:wrap}
.die.big{width:118px;height:118px;font-size:44px;border:0;cursor:pointer;flex:none;transition:transform .2s,filter .2s}
.die.big:hover{transform:scale(1.05) rotate(-4deg);filter:brightness(1.08)}
.die.big:active{transform:scale(.95)}
.dice-top-r{flex:1;min-width:240px;display:flex;flex-direction:column;gap:8px}
.dice-top-r .dice-prev{margin-top:0}
.dice-hint{font-family:var(--f-script);font-size:26px;color:var(--rosapolvo)}
.dice-hint:empty{display:none}
.dice-last{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;opacity:.85}
.dice-top .dice-res{align-self:flex-start}
.cr-form{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end}
.cr-form>*{grid-column:span 1}.cr-form .cr-h{grid-column:span 5}.cr-form .cr-df{grid-column:span 2}
.cr-form .btn{white-space:nowrap}
.cr-form label.chk{margin-bottom:8px;white-space:nowrap}
.cr-lg{margin-top:10px;max-height:260px}
@media (max-width:520px){.cr-form{grid-template-columns:repeat(3,1fr)}.cr-form .cr-h{grid-column:span 2}.cr-form .cr-df{grid-column:span 3}}
.skin-dk .dice-hint{font-family:var(--f-body);font-style:italic;font-size:17px;color:var(--sk-sub)}
.skin-chef .dice-hint{font-family:'Pinyon Script',cursive;color:var(--salvia)}

.in.calc{box-shadow:inset 0 0 0 1.5px var(--champagne);background:rgba(var(--champagne-rgb),.18)}
.in.miss{box-shadow:inset 0 0 0 1.5px var(--rosapolvo)}

/* ───── PMA (inicio) ───── */
.pma-k{font-family:var(--f-title);font-size:13px;letter-spacing:.6em;color:var(--champagne);margin-bottom:4px;padding-left:.6em}
.pma-q{text-align:center;font-family:var(--f-name);font-size:clamp(22px,3vw,30px);margin:6px 0 16px;color:var(--lila)}
.pma-q b{color:var(--amatista)}
.pma-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.pma-card{text-align:center;padding:24px 22px;transition:transform .3s}
.pma-card:hover{transform:translateY(-3px)}
.pma-card h2{font-family:var(--f-name);font-size:30px;margin:4px 0 0;color:var(--lila)}
.pma-card .script{font-family:var(--f-script);font-size:24px;color:var(--rosapolvo);margin:-2px 0 12px}
.pma-card label.f{text-align:left}
.pma-ico{width:74px;height:74px;margin:0 auto;color:var(--lila);padding:12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,rgba(var(--lavanda-rgb),.45));box-shadow:0 0 0 2px #fff,0 0 0 3px var(--oro)}
.pma-ico svg{width:100%;height:100%}
.pma-list-h{font-family:var(--f-title);font-size:11px;letter-spacing:.2em;color:var(--lila);margin:18px 0 8px;display:flex;align-items:center;gap:10px}
.pma-list-h::before,.pma-list-h::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--oro),transparent)}
.pma-list{list-style:none;padding:0;margin:0 0 10px;display:flex;flex-direction:column;gap:6px;text-align:left}
.pma-item{width:100%;border:0;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:9px 12px;border-radius:12px;background:rgba(255,255,255,.6);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink);transition:.15s}
.pma-item:hover{background:#fff;box-shadow:inset 0 0 0 1px var(--oro)}
.pma-item b{font-family:var(--f-name);font-size:16px}
.pma-list li{display:flex;gap:6px;align-items:stretch}
.pma-list li .pma-item{flex:1;min-width:0}
.pma-x{flex:none;border:0;cursor:pointer;min-width:34px;padding:0 10px;border-radius:12px;background:transparent;color:var(--muted);font-size:13px;box-shadow:inset 0 0 0 1px var(--line);transition:.15s;font-family:inherit}
.pma-x:hover{color:var(--rosapolvo);box-shadow:inset 0 0 0 1px var(--rosapolvo)}
.pma-x.armed{background:var(--rosapolvo);color:#fff;font-size:11.5px;font-weight:700;box-shadow:none}
.skin-dk .pma-x{color:var(--sk-sub);box-shadow:inset 0 0 0 1px var(--sk-border2)}
.skin-dk .pma-x:hover{color:var(--sk-name);box-shadow:inset 0 0 0 1px var(--sk-name)}
.skin-dk .pma-x.armed{background:var(--sk-alert);color:var(--sk-text)}
.pma-item span{font-size:11.5px;color:var(--muted);white-space:nowrap}
/* ───── Fases de posteo ───── */
.fz{margin:0 0 12px;padding:12px 16px;border-radius:14px;background:rgba(255,255,255,.6);box-shadow:inset 0 0 0 1px var(--line);font-size:14px}
.fz-k{font-family:var(--f-title);font-size:11px;letter-spacing:.16em;color:var(--lila);margin-right:6px}
.fz-mini{font-size:12px;opacity:.85;margin-top:3px}
.fz-bar{position:relative;display:flex;height:10px;border-radius:99px;overflow:visible;margin-top:10px;background:rgba(var(--lavanda-rgb),.25)}
.fz-s{height:100%}.fz-s:first-child{border-radius:99px 0 0 99px}.fz-s:last-of-type{border-radius:0 99px 99px 0}
.fzs-rap{background:linear-gradient(90deg,#e7c873,#f0dca0)}.fzs-nor{background:linear-gradient(90deg,#9fc39a,#bcd7b4)}.fzs-len{background:linear-gradient(90deg,#d9a0a8,#c27a86)}
.fz-now{position:absolute;top:-5px;width:4px;height:20px;margin-left:-2px;border-radius:3px;background:var(--ink);box-shadow:0 0 0 2px #fff}
.fz-leg{display:flex;justify-content:space-between;font-size:10.5px;opacity:.75;margin-top:4px}
.fz.fz-rap{box-shadow:inset 4px 0 0 #e0bb55,inset 0 0 0 1px var(--line)}
.fz.fz-nor{box-shadow:inset 4px 0 0 #7fae78,inset 0 0 0 1px var(--line)}
.fz.fz-len{box-shadow:inset 4px 0 0 #c27a86,inset 0 0 0 1px var(--line)}
.fz.fz-cerrado{opacity:.85}
.faltan{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin:0 0 14px;padding:10px 14px;border-radius:14px;background:rgba(var(--rosa-rgb),.16);box-shadow:inset 0 0 0 1px var(--line);font-size:13px}
.faltan.ok{background:rgba(104,112,95,.14)}
.faltan-k{font-weight:700}
.faltan-chip{border:0;cursor:pointer;padding:4px 11px;border-radius:999px;background:rgba(255,255,255,.85);box-shadow:inset 0 0 0 1px var(--oro);font-weight:600;font-size:12.5px;color:var(--ink)}
span.faltan-chip{cursor:default}
.faltan-chip i{font-style:normal;opacity:.7;font-size:11px}
.faltan-chip.aus{opacity:.55}
button.faltan-chip:hover{background:var(--champagne)}
.fz-ed{margin:0 0 12px}
.dark .fz,.dark .pma-item{background:rgba(255,255,255,.05)}
.skin-dk .fz,.skin-dk .faltan,.skin-dk .pma-item{background:var(--sk-meta);color:var(--sk-text)}
.skin-dk .fz-k,.skin-dk .pma-list-h,.skin-dk .pma-q{color:var(--sk-accent);font-family:var(--f-title)}
.skin-dk .faltan-chip{background:var(--sk-panel);color:var(--sk-text);box-shadow:inset 0 0 0 1px var(--sk-border)}
.skin-dk .pma-card h2{color:var(--sk-title);font-family:var(--f-name)}
.skin-dk .pma-ico{background:var(--sk-panel2);color:var(--sk-accent);box-shadow:0 0 0 1px var(--sk-accent)}
.skin-chef .fz,.skin-chef .pma-item{background:#FBF7EF}
.skin-chef .pma-k{color:var(--lila)}

.pt-h{font-family:var(--f-title);font-size:11px;letter-spacing:.16em;color:var(--lila);margin:14px 0 6px}
.pt-tab{display:flex;flex-direction:column;gap:6px}
.pt-row{display:grid;grid-template-columns:minmax(110px,1fr) 210px auto auto minmax(180px,1.4fr);gap:8px;align-items:center;padding:6px 8px;border-radius:10px;background:rgba(255,255,255,.5);box-shadow:inset 0 0 0 1px var(--line)}
.pt-row b{font-family:var(--f-name);font-size:15px}
.pt-res{font-size:12.5px;display:flex;align-items:center;gap:6px}
.pt-res .tsel{width:30px;height:24px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;flex:none}
@media (max-width:760px){.pt-row{grid-template-columns:1fr 1fr}.pt-row b,.pt-res{grid-column:span 2}}
.skin-dk .pt-row{background:var(--sk-meta);box-shadow:inset 0 0 0 1px var(--sk-border2)}
.skin-dk .pt-h{color:var(--sk-accent)}
.dark .pt-row{background:rgba(255,255,255,.05)}

.mc-chip{font-family:var(--f-title);letter-spacing:.14em;background:rgba(255,255,255,.7);color:var(--lila);box-shadow:inset 0 0 0 1px var(--oro);padding:6px 12px}
.skin-dk .mc-chip{background:var(--sk-meta);color:var(--sk-accent)}
/* ───── Guía de tiradas ───── */
.guia-h{text-align:center;margin-bottom:10px}
.guia-h .script{font-family:var(--f-script);font-size:24px;color:var(--rosa)}
.guia-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px -8px 14px;padding:8px;border-radius:12px;position:sticky;top:6px;z-index:3;background:var(--modal-bg);box-shadow:0 8px 18px -12px rgba(0,0,0,.5)}
.guia-bar .in{flex:1;min-width:200px}
.g-hide{display:none!important}
details.g-sec{border-radius:14px;margin:0 0 10px;background:rgba(255,255,255,.45);box-shadow:inset 0 0 0 1px var(--line)}
details.g-sec>summary{cursor:pointer;list-style:none;padding:12px 16px;font-family:var(--f-title);font-size:15px;letter-spacing:.06em;color:var(--lila);display:flex;align-items:center;gap:10px}
details.g-sec>summary::-webkit-details-marker{display:none}
details.g-sec>summary::before{content:"✦";color:var(--oro);font-size:11px;transition:transform .3s}
details.g-sec[open]>summary::before{transform:rotate(45deg)}
.g-body{padding:2px 18px 16px;line-height:1.6}
.g-body h2{font-family:var(--f-name);font-size:19px;font-weight:600;color:var(--amatista);margin:16px 0 6px}
.g-body p{margin:6px 0}
.g-body ul,.g-card ul{list-style:none;margin:6px 0;padding:0}
.g-body li{display:block;margin:3px 0;padding:0 0 0 18px;position:relative;text-indent:0}
.g-body li::before{content:"✧";position:absolute;left:2px;top:0;color:var(--oro);font-size:12px}
.skin-dk .g-body li::before{color:var(--sk-accent)}
.g-sub{font-family:var(--f-title);font-size:11.5px;letter-spacing:.18em;color:var(--oro);margin:16px 0 4px!important}
.g-sub::before{content:"✧ "}
.g-note{margin:12px 0;padding:10px 16px;border-radius:12px;background:rgba(var(--champagne-rgb),.18);box-shadow:inset 3px 0 0 var(--oro)}
.g-note p:first-child strong{font-family:var(--f-title);font-size:12px;letter-spacing:.16em;color:var(--oro)}
.g-card{margin:10px 0;padding:10px 16px 8px;border-radius:12px;background:rgba(255,255,255,.55);box-shadow:inset 0 0 0 1px var(--line)}
.g-card-h{font-family:var(--f-name);font-size:18px;color:var(--lila)}
.g-card-h p{margin:0}
.g-card p em{color:var(--muted)}

.g-tw{overflow-x:auto;margin:10px 0}
.g-t{width:100%;border-collapse:collapse;font-size:14px}
.g-t th{font-family:var(--f-title);font-size:10.5px;letter-spacing:.16em;font-weight:600;text-align:left;color:var(--muted);padding:6px 10px;border-bottom:1px solid var(--oro)}
.g-t td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.g-t td.g-k{white-space:nowrap;color:var(--lila)}
.dark details.g-sec,.dark .g-card{background:rgba(255,255,255,.05)}
.skin-dk details.g-sec{background:var(--sk-meta);box-shadow:inset 0 0 0 1px var(--sk-border2);border-radius:var(--radius)}
.skin-dk details.g-sec>summary{color:var(--sk-title);font-family:var(--f-title)}
.skin-dk details.g-sec>summary::before{color:var(--sk-accent)}
.skin-dk .g-body{color:var(--sk-text)}
.skin-dk .g-body h2,.skin-dk .g-card-h,.skin-dk .g-t td.g-k{color:var(--sk-name);font-family:var(--f-name)}
.skin-dk .g-sub,.skin-dk .g-note p:first-child strong{color:var(--sk-accent);font-family:var(--f-label)}
.skin-dk .g-note{background:rgba(255,255,255,.04);box-shadow:inset 3px 0 0 var(--sk-accent)}
.skin-dk .g-card{background:var(--sk-panel2);box-shadow:inset 0 0 0 1px var(--sk-border2)}
.skin-dk .g-card p em{color:var(--sk-sub)}
.skin-dk .g-t th{color:var(--sk-sub);border-bottom-color:var(--sk-border);font-family:var(--f-label)}
.skin-dk .g-t td{border-bottom-color:var(--sk-border2)}
.skin-dk .guia-h .script{font-family:var(--f-body);font-style:italic;font-size:15px;color:var(--sk-sub)}
.skin-chef .g-card,.skin-chef details.g-sec{background:#FBF7EF}

/* ───── Herramientas de master (inicio) ───── */
.pma-link{text-decoration:none}
.pma-link span::after{content:" →"}
.pma-tools-h{max-width:520px;margin:26px auto 10px}
.pma-tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;max-width:760px;margin:0 auto}
.pma-tool{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:16px 18px;text-decoration:none;color:inherit;transition:transform .2s,box-shadow .2s}
.pma-tool:hover{transform:translateY(-2px);box-shadow:0 0 0 1px var(--oro),0 14px 30px -18px rgba(0,0,0,.5)}
.pma-tool-i{font-size:24px;line-height:1}
.pma-tool b{font-family:var(--f-name);font-size:19px;color:var(--lila)}
.pma-tool span:last-child{font-size:13px;color:var(--muted)}
.skin-dk .pma-tool b{color:var(--sk-title)}
.skin-dk .pma-tool span:last-child{color:var(--sk-sub)}
.skin-dk .pma-tool:hover{box-shadow:0 0 0 1px var(--sk-accent),0 14px 30px -18px #000}
.skin-pam .pma-tool b{font-style:italic;font-weight:600}
/* ───── APARIENCIA ───── */
.theme-panel{margin:-4px 0 16px}
.theme-panel>summary{list-style:none;cursor:pointer;font-weight:700;color:var(--lila);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.theme-panel>summary::-webkit-details-marker{display:none}
.theme-panel>summary .sw{width:22px;height:22px;border-radius:50%;box-shadow:0 0 0 2px #fff,0 0 0 3px var(--oro)}
.theme-grid{display:grid;grid-template-columns:170px 1fr;gap:22px;align-items:center;margin-top:14px}
.wheel{position:relative;width:160px;height:160px;border-radius:50%;cursor:crosshair;touch-action:none;
  background:conic-gradient(hsl(0,55%,62%),hsl(60,55%,62%),hsl(120,55%,62%),hsl(180,55%,62%),hsl(240,55%,62%),hsl(300,55%,62%),hsl(360,55%,62%));
  box-shadow:0 0 0 4px #fff,0 0 0 6px var(--oro),0 10px 24px -10px rgba(var(--ciruela-rgb),.8)}
.wheel .core{position:absolute;inset:40px;border-radius:50%;z-index:1;background:linear-gradient(135deg,var(--ciruela),var(--lila),var(--amatista),var(--rosa));box-shadow:0 0 0 4px #fff,0 0 0 6px var(--champagne)}
.wheel .knob{position:absolute;z-index:2;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px var(--lila),0 2px 8px rgba(0,0,0,.35);pointer-events:none}
.presets{display:flex;flex-wrap:wrap;gap:8px}
.preset{border:0;cursor:pointer;display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;background:rgba(255,255,255,.75);font-weight:600;font-size:12.5px;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.preset i{width:24px;height:24px;border-radius:50%;display:block;box-shadow:0 0 0 2px #fff}
.preset.on{box-shadow:inset 0 0 0 2px var(--amatista)}
.trow{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-top:14px}
.trow input[type=range]{accent-color:var(--amatista);width:160px}
.seg{display:inline-flex;flex-wrap:wrap;border-radius:999px;background:rgba(255,255,255,.6);padding:3px;box-shadow:inset 0 0 0 1px var(--line)}
.seg button{border:0;background:transparent;cursor:pointer;padding:5px 12px;border-radius:999px;font-weight:600;font-size:12px;color:var(--ink)}
.seg button.on{background:linear-gradient(135deg,var(--champagne),var(--oro));color:var(--carbon)}
@media (max-width:640px){.theme-grid{grid-template-columns:1fr;justify-items:center}}

.bigcode{font-family:var(--f-title);font-size:40px;letter-spacing:.18em;text-align:center;color:var(--lila);background:#fff;border-radius:14px;padding:10px;box-shadow:inset 0 0 0 2px var(--champagne)}

/* ════════ SKIN · MAGIC CHEF ════════ */
.skin-deco{display:none}
:root.skin-chef{--f-title:'Cinzel',serif;--f-name:'Cormorant Garamond',serif;--f-script:'Pinyon Script',cursive;--f-body:'Cormorant Garamond',serif;
  --glass:rgba(251,247,239,.94);--radius:12px}
:root.skin-chef body{font-size:16.5px;color:var(--ink);background:
  repeating-linear-gradient(92deg,rgba(69,55,43,.035) 0 2px,transparent 2px 9px,rgba(69,55,43,.02) 9px 10px,transparent 10px 23px),
  repeating-linear-gradient(88deg,transparent 0 40px,rgba(255,255,255,.12) 40px 42px,transparent 42px 97px),
  linear-gradient(180deg,#E7D5B8,#D9C19C);background-attachment:fixed}
.skin-chef .bfly,.skin-chef .moon,.skin-chef .card-top .bfly,.skin-chef .portrait .ph svg{display:none}
.skin-chef .in,.skin-chef .btn,.skin-chef .pill,.skin-chef .preset,.skin-chef .seg button,.skin-chef label.f,.skin-chef .chip,.skin-chef .fcnt{font-family:'Cormorant Garamond',serif;font-weight:600}
.skin-chef .in{font-size:15.5px;background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.skin-chef .in:focus{box-shadow:inset 0 0 0 1.5px var(--lila)}
.skin-chef label.f,.skin-chef table.t th{font-family:'Cinzel',serif;font-size:10px;letter-spacing:.2em;color:var(--salvia)}
/* paneles: hoja de marfil con línea fina */
.skin-chef .panel{border-radius:12px;box-shadow:0 18px 40px -26px rgba(69,55,43,.55),inset 0 0 0 1px var(--line);backdrop-filter:none}
.skin-chef .block,.skin-chef details.fold{background:#F5EDDD;box-shadow:inset 0 0 0 1px var(--line);border-radius:10px}
.skin-chef table.t.view td{background:#FBF7EF;border-bottom:1px dashed var(--line)}
.skin-chef .sec-title,.skin-chef .block h4,.skin-chef details.fold>summary{font-family:'Cinzel',serif;font-weight:600;text-transform:uppercase;letter-spacing:.24em;font-size:11px;color:var(--lila)}
.skin-chef .block h4::before,.skin-chef details.fold>summary::before{content:"";width:6px;height:6px;background:var(--oro);transform:rotate(45deg);flex:none;animation:titilar 3.5s ease-in-out infinite}
.skin-chef details.fold>summary::after{content:"";width:7px;height:7px;border-right:1.5px solid var(--oro);border-bottom:1.5px solid var(--oro);transform:rotate(-45deg);margin-right:4px}
.skin-chef details.fold[open]>summary::after{transform:rotate(45deg)}
.skin-chef details.fold .cnt{background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--salvia);font-family:'Cormorant Garamond',serif;font-weight:700}
.skin-chef .sec-title::before,.skin-chef .sec-title::after{background:linear-gradient(90deg,transparent,var(--oro),transparent);background-size:200% 100%;animation:brillo 6s linear infinite}
@keyframes brillo{from{background-position:200% 0}to{background-position:-200% 0}}
@keyframes titilar{0%,100%{opacity:.45}50%{opacity:1}}
/* cabecera: tabla de madera con hoja de marfil */
.skin-chef .hero{background:linear-gradient(180deg,#FBF7EF,#F5EDDD);color:var(--ink);
  box-shadow:0 0 0 8px #D9C19C,0 0 0 9px rgba(69,55,43,.18),0 22px 44px -24px rgba(58,42,31,.7)}
.skin-chef .hero::before{display:none}
.skin-chef .hero h1{font-family:'Cinzel',serif;font-weight:700;letter-spacing:.32em;text-transform:uppercase;font-size:clamp(20px,3.4vw,30px);
  background:none;-webkit-background-clip:initial;background-clip:initial;color:var(--lila);animation:flotar 6s ease-in-out infinite}
@keyframes flotar{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.skin-chef .hero .script{font-family:'Pinyon Script',cursive;color:var(--salvia);font-size:clamp(26px,3.4vw,36px)}
.skin-chef .hero .chip{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line);font-size:13px}
.skin-chef .hero .btn{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.skin-chef .hero .btn.on{background:var(--lila);color:#FBF7EF;box-shadow:none}
.skin-chef .skin-deco{display:block;position:absolute;inset:0;pointer-events:none}
.skin-chef .skin-deco i{position:absolute;bottom:14%;width:5px;height:5px;background:var(--oro);transform:rotate(45deg);opacity:0;animation:destello 7s ease-in infinite}
.skin-chef .skin-deco i:nth-child(1){left:10%;animation-delay:0s}
.skin-chef .skin-deco i:nth-child(2){left:22%;animation-delay:2.4s;width:4px;height:4px}
.skin-chef .skin-deco i:nth-child(3){left:35%;animation-delay:4.8s}
.skin-chef .skin-deco i:nth-child(4){left:64%;animation-delay:1.2s;width:4px;height:4px}
.skin-chef .skin-deco i:nth-child(5){left:76%;animation-delay:3.6s}
.skin-chef .skin-deco i:nth-child(6){left:88%;animation-delay:6s;width:3px;height:3px}
.skin-chef .skin-deco i:nth-child(7){left:50%;top:18px;bottom:auto;width:7px;height:7px;opacity:1;animation:titilar 3s ease-in-out infinite}
@keyframes destello{0%{opacity:0;transform:translateY(0) rotate(45deg)}20%{opacity:.9}100%{opacity:0;transform:translateY(-90px) rotate(45deg)}}
/* botones */
.skin-chef .btn{background:#FBF7EF;color:var(--lila);box-shadow:inset 0 0 0 1px var(--line);border-radius:10px;letter-spacing:.04em}
.skin-chef .btn:hover{background:#fff}

.skin-chef .savebar{background:rgba(58,42,31,.92);border-radius:14px;box-shadow:0 14px 34px -12px rgba(58,42,31,.7),inset 0 0 0 1px rgba(196,160,90,.5)}
/* pestañas */
.skin-chef .tab{font-family:'Cinzel',serif;font-size:12px;letter-spacing:.18em;text-transform:uppercase;background:rgba(251,247,239,.55);color:var(--muted);border-radius:10px 10px 3px 3px}
.skin-chef .tab.act{background:#FBF7EF;color:var(--lila);box-shadow:inset 0 -2px 0 var(--lila)}
.skin-chef .tab .dot{display:inline-block;width:5px;height:5px;background:var(--oro);transform:rotate(45deg);font-size:0;margin:0 8px 2px 0}

.skin-chef .master{background:linear-gradient(135deg,#8E4A30,#B05E3E);box-shadow:0 18px 40px -24px rgba(142,74,48,.9),inset 0 0 0 1px rgba(227,201,142,.45)}

.skin-chef .pill{background:#FBF7EF;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink);font-size:14px}
.skin-chef .pill.gold{background:linear-gradient(135deg,#E3C98E,#F5EDDD);box-shadow:inset 0 0 0 1px var(--oro)}
.skin-chef .vstat b{font-family:'Cormorant Garamond',serif;color:var(--lila);font-size:20px}

const ETAPA_B={infante:[8,1,1],adolescente:[12,2,2],joven:[17,3,3],adulto:[17,3,3],experimentado:[12,2,2],veterano:[8,1,1]};

function deriveAtr(f,hb){
  const c=f.combate||{}, p=f.puntos||{}, e=ETAPA_B[etapaKey(f.datos&&f.datos.etapa)], B=k=>n(hb[k]), ok=v=>typeof v==='number'&&isFinite(v), out={};
  if(ok(c.iniciativa)) out.percepcion=c.iniciativa-B('iniciativa');

function normParty(p){
  const d=newParty(); p=Object.assign(d,p||{});
  if(!Array.isArray(p.tb)||!p.tb.length) p.tb=[newTab(1)];
  p.tb=p.tb.map((t,i)=>{
    const b=Object.assign(newTab(i+1),t); b.ch=[];
    b.r=Object.assign({...DEF_RULES},t.r||{}); b.lg=Array.isArray(t.lg)?t.lg:[]; b.fz=Object.assign({hr:24,hl:12,pl:'N',t:{}},t.fz||{}); b.ev=t.ev?1:0; b.e=Object.assign({...DEF_EV},t.e||{});

const fromT=(t,len)=>{ let a=Array.isArray(t)?t:(typeof t==='string'?t.split('').map(c=>c==='-'?'':c):[]); a=a.slice(0,len); while(a.length<len)a.push(''); return a; };

function masterTurns(tb){
  let posts=0, tirada=0, faltas=0;
  tb.m.t.forEach((x,i)=>{ if(x==='Y'){posts++;tirada++;} else if(x==='Z') posts++; else if(x==='X'){ posts++; tirada++; faltas+=Math.max(0,parseInt(tb.m.f[i])||0); } else if(x==='F') faltas++; });
  return {posts,tirada,faltas};
}

const tramo=nj=>nj<=0?0:Math.max(1,Math.ceil((nj-1)/3));          // 2-4 →1, 5-7 →2, 8-10 →3…
function minTurnos(nt){ return nt<=25?5:nt<=50?10:15; }
function evStats(tb){
  const e=tb.e, umbral=minTurnos(tb.nt);
  const cuenta=tb.ch.map(ch=>{ const t=ch.t.filter(x=>x==='R'||x==='N'||x==='L').length;
    const medio=ch.est==='A'&&t<umbral; return {id:ch.id,t,peso:medio?0.5:1}; });
  const crudo=cuenta.reduce((a,x)=>a+x.peso,0), nj=Math.ceil(crudo);
  const tr=tramo(nj), botePorTurno=5*tr, masterPorTurno=tr?20+10*tr:0;
  const mt=masterTurns(tb), jugados=mt.posts;
  const bote=botePorTurno*jugados;
  const vel=e.vb?(nj<=15?5:10):0;
  const pjMaster=tb.ch.some(c=>c.mpj);
  const extraSinPJ=pjMaster?0:n(e.np)*mt.posts;
  const masterG=Math.max(0,mt.tirada*masterPorTurno+extraSinPJ-mt.faltas*n(tb.r.D));
  /* reparto del bote */
  const premio={}, maxGan=Math.floor(tb.ch.length/4); let ganadores=0, aviso='';
  if(e.bt==='coop'){
    if(e.ok&&tb.ch.length){ const cada=Math.floor(bote/tb.ch.length); tb.ch.forEach(c=>premio[c.id]=cada); }
  } else if(e.md==='equipo'){
    const eq=tb.ch.filter(c=>c.pz); ganadores=eq.length;
    if(eq.length){ const cada=Math.floor(bote/eq.length); eq.forEach(c=>premio[c.id]=cada); }
  } else {
    const pct=e.md==='uno'?{1:100}:{1:n(e.p1),2:n(e.p2),3:n(e.p3)};
    tb.ch.forEach(c=>{ if(c.pz&&pct[c.pz]){ premio[c.id]=Math.floor(bote*pct[c.pz]/100); ganadores++; } });
  }
  if(e.bt!=='coop'&&ganadores>maxGan) aviso=`Hay ${ganadores} premiados y el máximo es ${maxGan} (una cuarta parte de ${tb.ch.length} participantes).`;
  return {umbral,crudo,nj,tr,botePorTurno,masterPorTurno,jugados,tirada:mt.tirada,sinTirada:mt.posts-mt.tirada,faltas:mt.faltas,bote,vel,pjMaster,extraSinPJ,masterG,premio,ganadores,maxGan,aviso,cuenta};
}
function masterStats(tb){
  const mt=masterTurns(tb);
  if(tb.ev){ const ev=evStats(tb); return {posts:mt.posts,faltas:mt.faltas,tirada:mt.tirada,grageas:ev.masterG}; }
  return { posts:mt.posts, faltas:mt.faltas, grageas:Math.max(0,mt.posts*n(tb.r.M)-mt.faltas*n(tb.r.D)) };
}
function charStats(ch,tb){
  const c=k=>ch.t.filter(x=>x===k).length;
  const R=c('R'),N=c('N'),L=c('L'),J=c('J'),I=c('I');

  if(tb.ev){

    const turnos=R*(base+v)+N*base+L*Math.max(0,base-v)+J*n(r.J)+I*n(r.I);

  }

  return { R,N,L,J,I,total,grageas,comp:mf*n(r.C),pct:Math.min(100,total/tb.nt*100) };

function compact(p){
  const strip=o=>{
    if(Array.isArray(o)) return o.map(strip);
    if(o&&typeof o==='object'){const r={};for(const k in o){if(k==='id')continue;const v=strip(o[k]);if(v===''||v===null||v===undefined)continue;r[k]=v;}return r;}
    return o;
  };
  const c=JSON.parse(JSON.stringify(p));
  delete c.rg; c.tb.forEach(t=>{ delete t.lg; t.m.f=(t.m.f||[]).map((x,i)=>t.m.t[i]==='X'?x:0); while(t.m.f.length&&!t.m.f[t.m.f.length-1]) t.m.f.pop(); if(!t.m.f.length) delete t.m.f; t.m.t=toT(t.m.t); t.ch.forEach(ch=>{ ch.t=toT(ch.t); }); });
  return strip(c);
}
const b64u={
  enc(bytes){let s='';for(let i=0;i<bytes.length;i+=0x8000)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');},
  dec(str){str=str.replace(/-/g,'+').replace(/_/g,'/');while(str.length%4)str+='=';const b=atob(str);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
};
async function pipe(bytes,Stream,mode){ const s=new Blob([bytes]).stream().pipeThrough(new Stream(mode)); return new Uint8Array(await new Response(s).arrayBuffer()); }
async function encodeParty(p,rg){
  const c=compact(p); if(rg) c.rg=rg;
  const bytes=new TextEncoder().encode(JSON.stringify(c));
  if('CompressionStream' in window){ try{ return PREFIX+'z.'+b64u.enc(await pipe(bytes,CompressionStream,'deflate-raw')); }catch(e){} }
  return PREFIX+'p.'+b64u.enc(bytes);
}
async function decodeParty(code){
  code=String(code||'').replace(/\s+/g,'');
  const h=code.indexOf('#c='); if(h>=0) code=code.slice(h+3);
  const m=code.match(/^AVK1([zp])\.([A-Za-z0-9_-]+)$/);
  if(!m) throw new Error('Formato de código no válido');
  let bytes=b64u.dec(m[2]);
  if(m[1]==='z') bytes=await pipe(bytes,DecompressionStream,'deflate-raw');
  return normParty(JSON.parse(new TextDecoder().decode(bytes)));
}

/* ── Código fijo de misión ──
   Cada misión tiene UN código que se actualiza con cada guardado. Para que solo el master pueda actualizarlo,
   el documento guarda h = sha256(k_n). Al guardar, el master manda k_n (que solo se puede calcular con su
   contraseña) y el próximo candado h' = sha256(k_n+1). Las reglas de Firestore comprueban sha256(k) == h. */
const hex=u8=>[...u8].map(b=>b.toString(16).padStart(2,'0')).join('');
async function sha256hex(str){ return hex(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str)))); }
async function chainKey(pw,code,n){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode('PMA|'+code.toUpperCase()+'|'+n),iterations:60000,hash:'SHA-256'},km,256);
  return hex(new Uint8Array(bits));
}

      body:JSON.stringify({fields:fbFields(long,{h:{stringValue:h},n:{integerValue:'0'}})})});
    if(r.ok) return id;
    if(r.status===409) continue;
    if(r.status===403) throw new Error('Firebase no aceptó el guardado: revisá que pegaste las reglas nuevas');
    throw new Error('Firebase '+r.status);

}

  const h2=await sha256hex(await chainKey(pw,id,meta.n+1));

  if(r.status===403) throw Object.assign(new Error('Firebase no aceptó la actualización: revisá que pegaste las reglas nuevas'),{rules:1});

async function decodeFicha(code){
  code=String(code||'').trim();
  if(code.startsWith('{')||code.startsWith('[')) return JSON.parse(code);
  code=code.replace(/\s+/g,'');
  if(/^AVK1[zp]\./.test(code)) throw new Error('Eso es un código de partida, no de ficha');
  const corto=code.toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(/^AK\d{5}$/.test(corto)) code=await fetchFichaCorta(corto);
  const m=code.match(/^AVK([01])\.([A-Za-z0-9_-]+)$/);
  if(!m) throw new Error('Código de ficha no válido (tiene que ser como AK48213 o AVK1.…)');
  let bytes=b64u.dec(m[2]);
  if(m[1]==='1') bytes=await pipe(bytes,DecompressionStream,'deflate-raw');
  return JSON.parse(new TextDecoder().decode(bytes));
}
const cap=t=>String(t||'').replace(/_/g,' ').replace(/^\w/,c=>c.toUpperCase());
const V_EMOJI={'recursos':'💰','fama':'🏆','orden de merlín':'🎖️','orden de merlin':'🎖️','patrón':'🤝','patron':'🤝'};
const numOr=v=>{const x=parseFloat(v);return isNaN(x)?'':x;};
/* al recargar la ficha de un personaje que ya estaba, conserva lo gastado en la misión */

function keepSpent(c,base){
  ['pp','pr','pd'].forEach(k=>{ if(Array.isArray(base[k])&&n(base[k][0])) c[k][0]=n(base[k][0]); });
  if(Array.isArray(base.h)&&n(base.h[0])) c.h[0]=n(base.h[0]);
  if(Array.isArray(base.pa)&&base.pa[0]!==''&&n(base.pa[1])) c.pa[0]=Math.min(n(base.pa[0]),n(c.pa[1])||n(base.pa[0]));

    const used=new Set();
    newRows.forEach(r=>{ const i=oldRows.findIndex((o,j)=>!used.has(j)&&keyFn(o)===keyFn(r)); if(i>=0){ used.add(i); if(oldRows[i].u!==''&&oldRows[i].u!=null) r.u=oldRows[i].u; } });
    oldRows.forEach((o,j)=>{ if(!used.has(j)&&n(o.u)>0) newRows.push(Object.assign({},o,{d:[o.d,'(no está en la ficha nueva; se conserva porque tiene usos gastados)'].filter(Boolean).join(' ')})); });
  };
  carry(c.v,base.v||[],r=>nk(r.n));
  carry(c.tr,base.tr||[],r=>nk(r.n)+'|'+nk(r.c));

function fichaToChar(f,base){

  c.s=[f.raza?.nombre,esp,f.datos?.casa].filter(Boolean).join(' · ')||c.s;
  if(P.pociones!=null) c.pp=[0,n(P.pociones)];
  if(P.rituales!=null) c.pr=[0,n(P.rituales)];
  if(P.destino!=null)  c.pd=[0,n(P.destino)];
  if(C.heridas!=null) c.h=[0,n(C.heridas)];
  if(C.umbral_de_heridas!=null) c.u=String(C.umbral_de_heridas);
  if(C.pas!=null) c.pa=[n(C.pas),n(C.pas)];
  /* ventajas: rellena las 4 fijas y suma las que falten */
  const vs=(f.ventajas||[]);
  if(vs.length){
    const fixed=['Recursos','Fama','Orden de Merlín','Patrón'];
    c.v=fixed.map(nm=>{const x=vs.find(v=>String(v.nombre).toLowerCase()===nm.toLowerCase());
      return {n:V_EMOJI[nm.toLowerCase()]+' '+nm,l:x?String(x.nivel??''):'',u:'',m:x?numOr(x.nivel):'',d:x?.detalle||''};});
    vs.filter(v=>!fixed.some(nm=>nm.toLowerCase()===String(v.nombre).toLowerCase()))
      .forEach(v=>c.v.push({n:'✦ '+v.nombre,l:String(v.nivel??''),u:'',m:numOr(v.nivel),d:v.detalle||''}));
  }
  /* trasfondos */
  if((f.trasfondos||[]).length)
    c.tr=f.trasfondos.map(t=>({n:t.tipo||'',c:[t.general,t.especifica].filter(Boolean).join(' · '),l:t.nivel??'',u:'',m:'',d:t.detalle||t.notas||''}));
  /* inventario */
  const O=f.objetos||{}, catOf=k=>({basicos:'Básico',basico:'Básico',intermedios:'Intermedio',intermedio:'Intermedio',avanzados:'Avanzado',avanzado:'Avanzado'}[k]||'Especial');
  const inv=[]; Object.entries(O).forEach(([k,arr])=>(arr||[]).forEach(o=>inv.push({c:catOf(k),o:o.nombre||'',u:'',m:'',d:[k in {basicos:1,intermedios:1,avanzados:1}?'':cap(k),o.detalle].filter(Boolean).join(' · ')})));
  if(inv.length) c.inv=inv;

  const lab={iniciativa:'Iniciativa',ataque_fisico:'Ataque físico',ataque_magico:'Ataque mágico',defensa:'Defensa',lucha_fisica:'Lucha física',lucha_magica:'Lucha mágica'};
  const stats=Object.entries(lab).filter(([k])=>C[k]!=null).map(([k,l])=>`${l} ${C[k]}`).join(' · ');
  const at=Object.entries(f.atributos||{}).map(([k,v])=>`${cap(k)} ${v}`).join(' · ');
  const note=[stats&&'⚔ '+stats, at&&'✦ '+at].filter(Boolean).join('\n');
  if(note) c.no=base&&base.no&&!base.no.startsWith('⚔')?base.no+'\n\n'+note:note;
  if(f.habilidades||f.bonos){
    c.hb={}; c.hx={}; const std=new Set(HABS.map(h=>h[0])), arte=k=>/^arte|^artesan/.test(k);
    Object.entries(f.habilidades||{}).forEach(([g,hs])=>Object.entries(hs||{}).forEach(([k,h])=>{
      if(!std.has(k)&&!arte(k)) return;                     // descarta lo que no es una habilidad (objetos, totales…)
      if(h&&h.bono!=null) c.hb[k]=n(h.bono);
      if(!std.has(k)) c.hx[k]=[h.nombre||cap(k),'voluntad'];
    }));
    Object.entries(f.bonos||{}).forEach(([k,b])=>{ if(c.hb[k]==null&&(std.has(k)||arte(k))){ c.hb[k]=n(b); if(!std.has(k)) c.hx[k]=[cap(k.replace(/_/g,' ')),'voluntad']; } });
  }
  if(f.atributos||f.habilidades||f.combate){
    const at={}; Object.entries(f.atributos||{}).forEach(([k,v])=>{ if(ATR_N[k]&&v!=null&&v!=='') at[k]=n(v); });
    const dv=deriveAtr(f,c.hb||{}), atd={};
    ATRS.forEach(([k])=>{ if(at[k]==null&&dv[k]!=null){ at[k]=dv[k]; atd[k]=1; } });
    c.at=at; c.atd=atd;
  }
  if(base) keepSpent(c,base);
  if(f.combate){ c.cb={}; ['iniciativa','ataque_fisico','ataque_magico','defensa','lucha_fisica','lucha_magica'].forEach(k=>{ if(typeof f.combate[k]==='number') c.cb[k]=f.combate[k]; }); }
  return c;
}

const ESCALA=[[5,'Rutinaria'],[7,'Fácil'],[9,'Moderada'],[12,'Complicada'],[15,'Difícil'],[18,'Heroica'],[21,'Épica'],[25,'Imposible']];
const ESC_N=Object.fromEntries(ESCALA);
function grados(total,dif){
  if(total>=dif){ let g=0; ESCALA.forEach(([v])=>{ if(v>dif&&total>=v) g++; }); return {ok:1,g}; }
  let g=0; ESCALA.forEach(([v])=>{ if(v<dif&&total<v) g++; }); return {ok:0,g};
}
function resTxt(r){ return r.ok?`Éxito, ${r.g} ${r.g===1?'grado':'grados'}`:(r.g?`Fracaso, ${r.g} ${r.g===1?'grado':'grados'} de fracaso`:'Fracaso'); }

function logLine(e,withTurn){
  const parts=[e.pd&&!e.pv?`D10 (10, PD)`:`D10 (${e.d})`];
  if(e.pd&&e.pv) parts.push(`PD (7)`);
  parts.push(`${e.an} (${e.av})`); if(e.hn) parts.push(`${e.hn} (${e.hv})`);
  if(e.tf) parts.push(`${e.tf} (${e.tv||0})`);

  let s=parts.join(' + ');
  if(e.md) s+=' '+sgn(e.md);
  const r=grados(e.tot,e.df);
  return `${withTurn?`T${e.t} · `:''}✦ ${e.who} — ${s} = ${e.tot} vs ${e.dn} (${e.df}) → ${resTxt(r)}`;
}
function logText(tb,mode){

  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await pwKey(pw,salt),data));
  return {s:b64u.enc(salt),i:b64u.enc(iv),c:b64u.enc(ct)}; }

const OFICIAL={s:'pam'};
function genTheme(th){
  th=Object.assign({},DEF_THEME,th||OFICIAL);
  if(th.s&&SKINS[th.s]) return Object.assign({},SKINS[th.s].pal); const dh=th.h-BASE_H, out={};
  for(const k in BASE){ const [h,s,l]=rgb2hsl(hex2rgb(BASE[k])); out[k]=rgb2hex(hsl2rgb(h+dh,Math.min(1,s*th.k),l)); }
  const mt=METALS[th.m]||METALS.oro; out.champagne=mt.champagne; out.oro=mt.oro; out.carbon=mt.carbon; out._soft=mt.soft;
  const H=BASE_H+dh;
  out['bg-deep']=rgb2hex(hsl2rgb(H,.22*Math.min(1,th.k),.075));
  out['bg-mid']=rgb2hex(hsl2rgb(H,.18*Math.min(1,th.k),.13));
  out.ink=th.d?rgb2hex(hsl2rgb(H,.2,.9)):mt.carbon;
  return out;
}
function applyTheme(th){
  th=th||OFICIAL;
  const t=genTheme(th), st=document.documentElement.style;
  for(const k in t){ if(k[0]==='_') continue; st.setProperty('--'+k,t[k]); st.setProperty('--'+k+'-rgb',hex2rgb(t[k]).join(',')); }
  const pr=hex2rgb(t.perla), dark=!!(th&&th.d), lh=rgb2hsl(hex2rgb(t.lila))[0];
  const sk=th&&th.s&&SKINS[th.s];
  document.documentElement.classList.toggle('dark',dark&&!sk);
  Object.keys(SKINS).forEach(k=>document.documentElement.classList.toggle('skin-'+k,!!sk&&th.s===k));
  document.documentElement.classList.toggle('skin-dk',!!(sk&&sk.dk));
  if(sk){ st.setProperty('--muted',sk.muted); st.setProperty('--champagne-soft',t._soft); st.setProperty('--modal-bg',sk.modal); st.setProperty('--line',sk.line); return; }
  st.setProperty('--muted',rgb2hex(hsl2rgb(lh,.12*Math.min(1,th?.k??1),dark?.68:.45)));
  st.setProperty('--champagne-soft',t._soft);
  st.setProperty('--modal-bg',dark?`rgba(${hex2rgb(t['bg-mid']).join(',')},.97)`:`rgba(${pr.map(x=>Math.min(255,x+10)).join(',')},.97)`);
  st.setProperty('--line',`rgba(${hex2rgb(t.lila).join(',')},.18)`);
}
const swatch=th=>{const t=genTheme(th);if(th&&th.s==='chef') return `linear-gradient(135deg,${t.amatista} 0 30%,${t.lila} 30% 55%,${t.salvia} 55% 75%,${t.oro} 75% 88%,${t.perla} 88%)`;
  if(th&&th.s) return `linear-gradient(135deg,${t['bg-deep']} 0 38%,${t.ciruela} 38% 55%,${t.lila} 55% 70%,${t.rosa} 70% 84%,${t.champagne} 84%)`;return th&&th.d?`linear-gradient(135deg,${t['bg-deep']} 30%,${t.ciruela} 60%,${t.lila} 80%,${t.champagne})`:`linear-gradient(135deg,${t.ciruela},${t.amatista} 45%,${t.rosa} 75%,${t.champagne})`;};
const sameTheme=(a,b)=>(a.s||'')===(b.s||'')&&(a.s?true:a.h===b.h&&Math.abs(a.k-b.k)<.001&&a.m===b.m&&(a.d||0)===(b.d||0));

function setTheme(patch){
  const prevS=(S.party.th&&S.party.th.s)||'';
  if(patch.s===undefined) patch.s='';
  const th=S.party.th=Object.assign({},DEF_THEME,S.party.th||{},patch);
  if(prevS!==th.s){ applyTheme(th); markDirty(); render(); return; }
  applyTheme(th); markDirty();
  const [kx,ky]=knobPos(th.h), k=document.getElementById('knob'); if(k){k.style.left=kx+'px';k.style.top=ky+'px';}
  const sw=document.querySelector('#themePanel .sw'); if(sw) sw.style.background=swatch(th);
  document.querySelectorAll('.preset').forEach(b=>b.classList.toggle('on',sameTheme(PRESETS[b.dataset.preset],th)));
  document.querySelectorAll('[data-metal]').forEach(b=>b.classList.toggle('on',b.dataset.metal===th.m));
  document.querySelectorAll('[data-dark]').forEach(b=>b.classList.toggle('on',+b.dataset.dark===(th.d?1:0)));
  const r=document.getElementById('themeK'); if(r&&patch.k===undefined) r.value=th.k;
}
let wheelDrag=false;
function wheelHue(e){ const w=document.getElementById('wheel'); if(!w) return; const r=w.getBoundingClientRect();
  const ang=Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2))*180/Math.PI;
  setTheme({h:Math.round((ang+90+360)%360)}); }
document.addEventListener('pointerdown',e=>{ const w=e.target.closest('#wheel'); if(w){ wheelDrag=true; try{w.setPointerCapture(e.pointerId)}catch(_){} wheelHue(e); e.preventDefault(); }});
document.addEventListener('pointermove',e=>{ if(wheelDrag) wheelHue(e); });
document.addEventListener('pointerup',()=>{ wheelDrag=false; });

function sealOf(code){ let h=2166136261; for(let i=0;i<code.length;i++){h^=code.charCodeAt(i);h=Math.imul(h,16777619);} return (h>>>0).toString(36).toUpperCase().slice(0,5).padStart(5,'0'); }

function imgurFix(u){
  u=String(u||'').trim(); if(!u) return '';
  const m=u.match(/^https?:\/\/(?:m\.)?imgur\.com\/([A-Za-z0-9]{5,10})$/); if(m) return 'https://i.imgur.com/'+m[1]+'.png';
  return /^https:\/\//i.test(u)?u:'';
}
function fld(edit,val,path,o={}){
  if(!edit){ const v=(val===''||val===undefined||val===null)?(o.dash??'—'):val; return `<span class="${o.vcls||''}">${esc(v)}</span>`; }
  const ph=o.ph?` placeholder="${esc(o.ph)}"`:'';
  if(o.area) return `<textarea class="in ${o.cls||''}" data-k="${path}"${ph}>${esc(val)}</textarea>`;
  return `<input class="in ${o.num?'num':''} ${o.cls||''}" ${o.num?'inputmode="decimal"':''} data-k="${path}" value="${esc(val)}"${ph}${o.num?' data-num="1"':''}>`;
}
function barHTML(pair,kind){
  const used=n(pair[0]),max=n(pair[1]);
  if(max<=0) return `<div class="fillbar"><b style="width:0"></b></div>`;
  if(max<=30){ let s=''; for(let i=0;i<max;i++) s+=`<i class="${i<used?'f':''}"></i>`; return `<div class="segs">${s}</div>`; }
  return `<div class="fillbar"><b style="width:${Math.min(100,used/max*100)}%"></b></div>`;
}
function statRow(edit,label,pair,path,kind,mode){
  // mode: 'used' → restante = max-usados ; 'cur' → actual / máx
  const used=n(pair[0]),max=n(pair[1]);
  const restTxt = mode==='used' ? `Quedan ${Math.max(0,max-used)}` : '';
  const bar=`<div class="bar ${kind}" data-calc="bar" data-p="${path}">${barHTML(pair)}</div>`;
  if(edit) return `<div class="stat"><span class="lbl">${label}</span>${fld(1,pair[0],path+'.0',{num:1})}${fld(1,pair[1],path+'.1',{num:1,ph:'máx'})}<div class="bar ${kind}" data-calc="bar" data-p="${path}" style="grid-column:1/-1">${barHTML(pair)}</div></div>`;

      ${portrait}

      <details class="fold" data-fold="${edit?'m':'v'}:${ch.id}:tr" ${foldAttr(`${edit?'m':'v'}:${ch.id}:tr`,edit||(cnt(ch.tr)>0&&cnt(ch.tr)<=8))}><summary>🌿 Trasfondos <span class="cnt">${cnt(ch.tr)}</span></summary><div class="fold-in">

function evCardCtl(ch,tb,P,edit){
  const e=tb.e;
  if(!edit) return '';
  let puesto='';
  if(e.bt!=='coop'){
    if(e.md==='equipo') puesto=`<label class="chk"><input type="checkbox" data-k="${P}.pz" ${ch.pz?'checked':''}> En el equipo ganador</label>`;
    else { const ops=e.md==='uno'?[[0,'—'],[1,'Ganador']]:[[0,'—'],[1,'1º'],[2,'2º'],[3,'3º']];
      puesto=`<div><label class="f">Puesto</label><select class="in" data-k="${P}.pz" data-num="1">${ops.map(([v,l])=>`<option value="${v}" ${(+ch.pz||0)===v?'selected':''}>${l}</option>`).join('')}</select></div>`; }
  }
  return `<div class="evctl">
    <div><label class="f">Estado</label><select class="in" data-k="${P}.est">${[['','Activo'],['A','Se ausentó'],['T','Terminó por trama']].map(([v,l])=>`<option value="${v}" ${(ch.est||'')===v?'selected':''}>${l}</option>`).join('')}</select></div>
    ${puesto}
    <label class="chk"><input type="checkbox" data-k="${P}.mpj" ${ch.mpj?'checked':''}> PJ del master</label>
  </div>`;
}
function atrFold(ch,P,edit){
  const at=ch.at||{}, hb=ch.hb||{}, has=Object.keys(at).length||Object.values(hb).some(v=>v>0);
  const key=`${edit?'m':'v'}:${ch.id}:at`;
  let body='';
  if(edit){
    const miss=ATRS.filter(([a])=>at[a]==null||at[a]==='').map(x=>x[1]), calc=ATRS.filter(([a])=>ch.atd&&ch.atd[a]).map(x=>x[1]);
    body=`${miss.length?`<div class="evwarn" style="margin-bottom:8px">Faltan en la ficha: ${miss.join(', ')}. Completalos para que el dado los use.</div>`:''}
      ${calc.length?`<div class="tip" style="margin:0 0 8px">≈ ${calc.join(', ')}: la ficha no los traía y los calculé desde sus valores de combate (Iniciativa, Ataques, Defensa, Heridas y la etapa). Revisalos: si el personaje tiene bonos de raza u objetos pueden variar.</div>`:''}
      <div class="atr-grid">${ATRS.map(([a,an])=>`<div><label class="f">${an}${ch.atd&&ch.atd[a]?' ≈':''}</label>${fld(1,at[a]??'',`${P}.at.${a}`,{num:1,ph:'falta',cls:(ch.atd&&ch.atd[a]?'calc':'')+(at[a]==null||at[a]===''?' miss':'')})}</div>`).join('')}</div>
      <div class="hab-grid">${ATRS.map(([a,an])=>`<div class="hab-col"><div class="hab-h">${an} <span class="hab-av">${at[a]==null||at[a]===''?'—':n(at[a])}</span></div>${charHabs(ch).filter(h=>h[2]===a).map(h=>`<div class="hab-r"><span>${esc(h[1])}</span><select class="in" data-k="${P}.hb.${h[0]}" data-num="1">${NIVELES.map(([v,nm])=>`<option value="${v}" ${n(hb[h[0]])===v?'selected':''}>${nm}</option>`).join('')}</select></div>`).join('')}</div>`).join('')}</div>
      <div class="row"><button class="btn sm" data-addhab="${P}">+ Arte / Artesanía u otra</button></div>`;
  } else {
    if(!has) return '';
    body=`<div class="atr-view">${ATRS.map(([a,an])=>`<span><small>${an}</small><b>${at[a]==null||at[a]===''?'—':n(at[a])}</b></span>`).join('')}</div>
      <div class="hab-view" style="margin-bottom:8px">${CBS.map(([k,nm])=>`<span>${nm} <b>${cbVal(ch,k)}</b></span>`).join('')}</div>
      <div class="hab-view">${charHabs(ch).filter(h=>n(hb[h[0]])>0).map(h=>`<span>${esc(h[1])} <b>${NIV_N[n(hb[h[0]])]||''} +${n(hb[h[0]])}</b></span>`).join('')}</div>`;
  }
  const resumen=ATRS.map(([k,an])=>`<span class="${at[k]==null||at[k]===''?'am':''}">${an.slice(0,3)} ${at[k]==null||at[k]===''?'—':n(at[k])+(ch.atd&&ch.atd[k]?'≈':'')}</span>`).join('');
  return `<details class="fold atr-block" data-fold="${key}" ${foldAttr(key,false)}><summary>📐 Atributos y habilidades <span class="atr-sum">${resumen}</span></summary><div class="fold-in">${body}</div></details>`;
}
function sumPills(ch,tb){
  const s=charStats(ch,tb);
  return `<span class="pill gold">🍬 ${s.grageas} grageas</span><span class="pill">✦ ${s.total}/${tb.nt} turnos</span><span class="pill">R ${s.R} · N ${s.N} · L ${s.L}</span><span class="pill">FJ ${s.J} · FI ${s.I}</span>${s.comp?`<span class="pill" title="Compensación por faltas del master">+${s.comp} comp.</span>`:''}${s.premio?`<span class="pill gold" title="Premio del bote">🏆 +${s.premio} bote</span>`:''}${ch.mpj?`<span class="pill" title="PJ del master: sin bonus de velocidad">PJ del master</span>`:''}${ch.est==='A'?`<span class="pill">Ausente</span>`:ch.est==='T'?`<span class="pill">Terminó por trama</span>`:''}`;
}
function masterPills(tb){ const m=masterStats(tb); return `<span class="pill gold">🍬 ${m.grageas} grageas</span><span class="pill">✓ ${m.posts} turnos</span>${tb.ev?`<span class="pill">Con tirada ${m.tirada}</span>`:''}<span class="pill">Faltas ${m.faltas}</span>`; }
/* panel de cuentas del acontecimiento */
function evSummary(tb){
  const v=evStats(tb), e=tb.e;
  const row=(l,x,sub='')=>`<div class="evrow"><span>${l}${sub?`<small>${sub}</small>`:''}</span><b>${x}</b></div>`;
  return `${row('Jugadores que cuentan',v.nj,v.crudo!==v.nj||v.cuenta.some(c=>c.peso<1)?`${v.crudo} → redondeo hacia arriba · ausentes con menos de ${v.umbral} turnos cuentan como medio`:`mínimo ${v.umbral} turnos para contar entero`)}
    ${row('Master por turno con tirada',v.masterPorTurno+' grageas',`${v.tirada} turnos con tirada · ${v.sinTirada} sin tirada`)}
    ${row('Master sin PJ propio',v.pjMaster?'no aplica':`+${n(e.np)} × ${v.jugados} turnos`,v.pjMaster?'el master juega con un PJ (marcado en su tarjeta)':'el master no juega con PJ')}
    ${row('Bote',`${v.bote} grageas`,`${v.botePorTurno} por turno × ${v.jugados} turnos jugados`)}
    ${row('Bonus de velocidad',e.vb?`±${v.vel} por turno`:'desactivado',e.vb?(v.nj<=15?'15 jugadores o menos':'16 jugadores o más')+' · no aplica al PJ del master':'')}
    ${e.bt==='coop'?row('Reparto (cooperativo)',e.ok&&tb.ch.length?`${Math.floor(v.bote/tb.ch.length)} c/u`:'pendiente',e.ok?'objetivos logrados: se reparte entre todos':'se reparte solo si se logran los objetivos')
      :row('Reparto (competitivo)',`${v.ganadores} / ${v.maxGan} premiados`,{top3:`Top 3 escalonado ${e.p1}/${e.p2}/${e.p3} %`,uno:'Ganador único',equipo:'Equipo a partes iguales'}[e.md])}
    ${v.aviso?`<div class="evwarn">⚠ ${v.aviso}</div>`:''}`;
}

  const head = edit ? `<div class="panel" style="margin-bottom:16px">
      <div class="tb-head">
        <div><label class="f">Nombre de la tablilla</label>${fld(1,tb.n,`tb.${ti}.n`,{ph:'Ej: Escena 1 · El bosque'})}</div>

      ${tb.ev?`<details class="rules" open><summary>✦ Reglas del acontecimiento</summary>
        <div class="rules-grid">
          <div><label class="f">Grageas por turno</label>${fld(1,tb.e.base,`tb.${ti}.e.base`,{num:1})}</div>
          <div><label class="f">Master sin PJ, por turno</label>${fld(1,tb.e.np,`tb.${ti}.e.np`,{num:1})}</div>

        </div>
        <div class="trow">
          <label class="chk"><input type="checkbox" data-k="tb.${ti}.e.vb" ${tb.e.vb?'checked':''}> Dar bonus por posteo rápido / lento</label>
          <div><label class="f">Bote</label><div class="seg"><button data-eset="${ti}" data-key="bt" data-val="comp" class="${tb.e.bt!=='coop'?'on':''}">Competitivo</button><button data-eset="${ti}" data-key="bt" data-val="coop" class="${tb.e.bt==='coop'?'on':''}">Cooperativo</button></div></div>
          ${tb.e.bt==='coop'?`<label class="chk"><input type="checkbox" data-k="tb.${ti}.e.ok" ${tb.e.ok?'checked':''}> Objetivos logrados</label>`
          :`<div><label class="f">Reparto</label><div class="seg">${[['top3','Top 3'],['uno','Ganador único'],['equipo','Equipo']].map(([k,l])=>`<button data-eset="${ti}" data-key="md" data-val="${k}" class="${tb.e.md===k?'on':''}">${l}</button>`).join('')}</div></div>`}
        </div>
        ${tb.e.bt!=='coop'&&tb.e.md==='top3'?`<div class="rules-grid" style="margin-top:10px">${['p1','p2','p3'].map((k,i)=>`<div><label class="f">${i+1}º puesto (%)</label>${fld(1,tb.e[k],`tb.${ti}.e.${k}`,{num:1})}</div>`).join('')}</div>`:''}
        <div class="tip">El master cobra solo los turnos marcados <b>✓ con tirada</b> (los ○ sin tirada no cobran, salvo que los marques ✓, por ejemplo apertura y cierre). Los premios del bote nunca pueden ir a más de una cuarta parte de los participantes. En cada tarjeta marcás si es el PJ del master, si se ausentó y el puesto.</div>

      <div class="row"><button class="btn sm ghost" data-deltab="${ti}" style="color:var(--ciruela)">Eliminar esta tablilla</button></div>
    </div>` : '';
  const tAct=turnoActual(tb);

}

      <div class="row" style="justify-content:center"><button class="btn sm ghost" data-mode="master" data-fresh="1">+ Nueva partida</button><button class="btn sm ghost" data-gomaster-load="1">📜 Cargar un código</button></div>

      <div class="row" style="margin-top:0"><input class="in" id="homeCode" placeholder="El código que dejó tu master (ej: X7K2P9)" style="flex:1;font-family:var(--f-title);letter-spacing:.12em;text-align:center"><button class="btn prime" data-load-view="homeCode">🔮 Ver</button></div>
      <div class="pma-list-h">Partidas que viste</div>
      ${seen.length?`<ul class="pma-list">${seen.slice(0,8).map(x=>`<li><button class="pma-item" data-seen="${esc(x.code)}"><b>${esc(x.title)}</b><span>${/^AVK/.test(x.code)?'código largo':esc(x.code)} · guardado n.º ${x.sv} · ${fmtD(x.at)}</span></button><button class="pma-x" data-sdel="${esc(x.code)}" title="Quitar de la lista" aria-label="Quitar de la lista">✕</button></li>`).join('')}</ul>`
