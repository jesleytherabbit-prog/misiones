/* ── Guía de tiradas para másters (Sistema Avadense) ── */
const GUIA_HTML=`<details class="g-sec" open><summary>Antes de empezar</summary><div class="g-body"><p>La idea es tenerla a mano mientras masteas. No te dice "esta tirada es así acá" caso por caso: te cuenta <strong>para qué sirve cada tirada</strong>, así cuando alguien pregunta "¿Alerta o Investigación?" lo tienes claro al toque.</p><p>Todo sale del manual (Sistemas, Las Habilidades y Los Trasfondos) y de las reglas del foro.</p><div class="g-note"><p><strong>✦ LO ESENCIAL</strong></p><p>Toda tirada es de una Habilidad: <strong>1d10 + Atributo + Habilidad</strong>, contra una dificultad.</p><p>Si dudas de la dificultad, usa <strong>Moderada (9)</strong>.</p><p>Los bonos externos nunca suman más de <strong>+7</strong>.</p></div></div></details><details class="g-sec"><summary>I. Cómo funciona una tirada</summary><div class="g-body"><h2>1. La tirada y las dificultades</h2><p>Cada tirada se hace de una Habilidad. Se suma el bonificador del Atributo asociado y el de la Habilidad al d10, y se compara con la dificultad. <strong>Se logra si se iguala o se supera.</strong></p><div class="g-tw"><table class="g-t"><thead><tr><th>DIFICULTAD</th><th>VALOR</th><th>EJEMPLO DEL SISTEMA</th></tr></thead><tbody><tr><td class="g-k"><strong>Rutinaria</strong></td><td>5</td><td>Caminar a paso rápido. Normalmente no se tira.</td></tr><tr><td class="g-k"><strong>Fácil</strong></td><td>7</td><td>Entender las reglas del Ajedrez Mágico, buscar algo en un libro.</td></tr><tr><td class="g-k"><strong>Moderada</strong></td><td>9</td><td>Distinguir tipos de dragón a simple vista. <strong>La de por defecto si dudas.</strong></td></tr><tr><td class="g-k"><strong>Complicada</strong></td><td>12</td><td>Traducir un texto de un idioma mágico.</td></tr><tr><td class="g-k"><strong>Difícil</strong></td><td>15</td><td>Reconocer a un personaje de un cuadro que visita otro cuadro.</td></tr><tr><td class="g-k"><strong>Heroica</strong></td><td>18</td><td>Orientarse en escoba en mitad de una tormenta, preparar Felix Felicis.</td></tr><tr><td class="g-k"><strong>Épica</strong></td><td>21</td><td>Seguir el rastro de una criatura sobre piedra tras una semana de lluvia.</td></tr><tr><td class="g-k"><strong>Imposible</strong></td><td>25</td><td>Descubrir o forjar las Reliquias de la Muerte.</td></tr></tbody></table></div><h2>2. Grados, enfrentadas y valor pasivo</h2><p class="g-sub">GRADOS DE ÉXITO Y DE FRACASO</p><p>Igualar la dificultad da <strong>0 grados</strong>. Cada escalón de la tabla que se alcanza por encima es un Grado de Éxito; cada escalón por debajo que no se alcanza es un Grado de Fracaso.</p><ul><li> Dificultad 9 y sale <strong>11</strong>: éxito con 0 grados. </li><li> Dificultad 9 y sale <strong>15</strong>: éxito con 2 grados. </li><li> Dificultad 9 y sale <strong>6</strong>: fallo con 1 grado de fracaso. </li></ul><p class="g-sub">TIRADA ENFRENTADA</p><p>Dos PJs tiran y <strong>gana el resultado más alto</strong>. Se recomienda solo entre PJs; contra un PNJ, mejor poner una dificultad.</p><p>Si hay empate y no puede haberlo, gana el atributo que aparece antes en esta lista: <strong>Percepción, Voluntad, Carisma, Inteligencia, Destreza, Vigor, Poder</strong>. Aun así, solo es una victoria parcial.</p><p class="g-sub">DIFICULTAD DINÁMICA O VALOR PASIVO</p><p>Cuando el objetivo es un PJ que no compite activamente o no sabe que es objetivo, solo tira quien actúa: <strong>dificultad = 5 + Atributo + Habilidad del objetivo</strong>. Contra un PNJ, se usa la dificultad de la tabla más cercana a ese valor.</p><h2>3. Modificadores y casos especiales</h2><div class="g-tw"><table class="g-t"><thead><tr><th>REGLA</th><th>CÓMO SE APLICA</th></tr></thead><tbody><tr><td class="g-k"><strong>Modificadores</strong></td><td>Pequeño ±1, normal ±2, grande ±4. Se acumulan.</td></tr><tr><td class="g-k"><strong>Tope de bonos</strong></td><td>Los bonos externos (circunstancias, trasfondos, hechizos) nunca suman más de <strong>+7</strong>.</td></tr><tr><td class="g-k"><strong>Acción grupal</strong></td><td>Un PJ tira y cada compañero que apoya da +1, hasta +3.</td></tr><tr><td class="g-k"><strong>Asumir éxito</strong></td><td>Con calma total y sin consecuencias por fallar, el máster da el resultado como si el dado hubiera salido al máximo.</td></tr></tbody></table></div><div class="g-note"><p><strong>✦ EJEMPLO DE ASUMIR ÉXITO</strong></p><p>Abrir una puerta: sí se puede asumir éxito. Abrirla <strong>sin que se note que fue forzada</strong>: no, porque fallar tiene consecuencias.</p></div></div></details><details class="g-sec"><summary>II. Las que más se confunden</summary><div class="g-body"><h2>1. Percibir</h2><div class="g-note"><p><strong>✦ LA PREGUNTA CLAVE</strong></p><p>Las cuatro son de Percepción, pero miran cosas distintas: <strong>¿qué está buscando o notando el PJ?</strong></p><p>Si no estaba buscando y algo pasa: <strong>Alerta</strong>. Si se pone a buscar: <strong>Investigación</strong>. Si lo que hay que notar es magia: <strong>Consciencia</strong>. Si es una persona y lo que siente o calla: <strong>Empatía</strong>.</p></div><div class="g-card"><div class="g-card-h">✧ <strong>Alerta</strong></div><p><em>La atención a lo que se ve, se oye, se huele o se toca. Es reactiva.</em></p><ul><li><strong>Se usa para:</strong> notar un ruido, que alguien se acerca, escuchar una conversación a escondidas. </li><li><strong>No se usa para:</strong> buscar pistas a conciencia ni sacar conclusiones. </li><li><strong>Se enfrenta a:</strong> Sigilo. </li><li><strong>Ejemplo:</strong> oír pasos detrás en el Callejón Knockturn. </li></ul></div><div class="g-card"><div class="g-card-h">✧ <strong>Investigación</strong></div><p><em>Encontrar y juntar pistas para resolver misterios. Es activa y deductiva.</em></p><ul><li><strong>Se usa para:</strong> registrar una escena, distinguir un asesinato de un accidente, resolver robos y secuestros. </li><li><strong>No se usa para:</strong> darse cuenta de algo de golpe sin buscarlo. </li><li><strong>También es:</strong> la tirada de Biblioteca. </li><li><strong>Ejemplo:</strong> revisar la habitación y deducir que la víctima conocía al agresor. </li></ul></div><div class="g-card"><div class="g-card-h">✧ <strong>Consciencia</strong></div><p><em>Lo que pasa más allá del mundo material.</em></p><ul><li><strong>Se usa para:</strong> saber si algo está encantado, detectar un rastro mágico, tener un presentimiento, notar un recuerdo borrado. </li><li><strong>No se usa para:</strong> ver u oír cosas del mundo físico. </li><li><strong>Ejemplo:</strong> notar que el espejo tiene un encantamiento. </li></ul></div><div class="g-card"><div class="g-card-h">✧ <strong>Empatía</strong></div><p><em>Leer las emociones de otras personas.</em></p><ul><li><strong>Se usa para:</strong> saber si alguien miente o dice la verdad, conectar con alguien, fingir compasión. </li><li><strong>No se usa para:</strong> notar detalles físicos o pistas. </li><li><strong>Se enfrenta a:</strong> Subterfugio. </li><li><strong>Ejemplo:</strong> darse cuenta de que el tabernero oculta algo. </li></ul></div><h2>2. Hablar</h2><p>Las cinco son de Carisma. Lo que cambia es <strong>qué quiere conseguir el PJ</strong> con sus palabras.</p><div class="g-tw"><table class="g-t"><thead><tr><th>HABILIDAD</th><th>EL PJ QUIERE…</th><th>EJEMPLO</th></tr></thead><tbody><tr><td class="g-k"><strong>Oratoria</strong></td><td>Convencer con argumentos o transmitir una idea, de palabra o por escrito.</td><td>Un discurso, una carta formal, ganar un debate.</td></tr><tr><td class="g-k"><strong>Seducir</strong></td><td>Caer bien y estrechar la relación, sin convencer de nada concreto. Nunca fuerza deseo sexual en otro PJ.</td><td>Ganarse la simpatía de un rival.</td></tr><tr><td class="g-k"><strong>Subterfugio</strong></td><td>Mentir, ocultar sus motivos o aparentar lo que no es.</td><td>Hacerse pasar por empleado del Ministerio.</td></tr><tr><td class="g-k"><strong>Intimidación</strong></td><td>Presionar con miedo o autoridad para que hagan lo que quiere.</td><td>Que el guardia se aparte.</td></tr><tr><td class="g-k"><strong>Coordinación</strong></td><td>Organizar a un grupo para que actúe junto.</td><td>Dirigir una evacuación.</td></tr></tbody></table></div><h2>3. Otras confusiones habituales</h2><div class="g-card"><div class="g-card-h">✧ <strong>Inteligencia o Biblioteca</strong></div><ul><li> La habilidad de Inteligencia es <strong>lo que el PJ recuerda</strong>. </li><li> La Biblioteca es <strong>lo que tiene guardado y puede consultar</strong>. </li><li> Saber de memoria qué planta es esa: Herbología. Ir a sus libros a buscarla: tirada de Biblioteca. </li></ul></div><div class="g-card"><div class="g-card-h">✧ <strong>Callejeo o Latrocinio</strong></div><ul><li><strong>Callejeo</strong> es conocer la calle: a quién preguntar, la jerga, dónde comprar o vender. </li><li><strong>Latrocinio</strong> es la técnica del delito: abrir cerraduras, falsificar, reventar cajas fuertes. </li></ul></div><div class="g-card"><div class="g-card-h">✧ <strong>Frialdad o Empatía</strong></div><ul><li><strong>Frialdad</strong> resiste: no entrar en pánico, aguantar un interrogatorio o una manipulación. </li><li><strong>Empatía</strong> detecta: darse cuenta de que te están mintiendo. </li></ul></div><div class="g-card"><div class="g-card-h">✧ <strong>Estilo</strong></div><ul><li> Solo sirve para <strong>quedar bien</strong>, se tenga éxito o no. </li><li> Nunca supera otra tirada por sí mismo. </li></ul></div></div></details><details class="g-sec"><summary>III. Habilidades por atributo</summary><div class="g-body"><h2>1. Vigor y Destreza</h2><p>La tirada siempre es <strong>Atributo + Habilidad</strong> de la misma fila.</p><p class="g-sub">VIGOR</p><div class="g-tw"><table class="g-t"><thead><tr><th>HABILIDAD</th><th>LAS TIRADAS DE… SON PARA</th></tr></thead><tbody><tr><td class="g-k"><strong>Atletismo</strong></td><td>Esfuerzo físico: saltar entre edificios, escalar, trepar, correr, deportes no mágicos.</td></tr><tr><td class="g-k"><strong>Pelea</strong></td><td>Combate físico con puños, patadas o armas. Es el Ataque Físico (Vigor + Pelea).</td></tr></tbody></table></div><p class="g-sub">DESTREZA</p><div class="g-tw"><table class="g-t"><thead><tr><th>HABILIDAD</th><th>LAS TIRADAS DE… SON PARA</th></tr></thead><tbody><tr><td class="g-k"><strong>Esquivar</strong></td><td>Ponerse a cubierto y evitar daño. Da la Defensa (5 + Destreza + Esquivar).</td></tr><tr><td class="g-k"><strong>Latrocinio</strong></td><td>Técnica criminal: abrir cerraduras, falsificar documentos, cajas fuertes, allanar, timos de trilero.</td></tr><tr><td class="g-k"><strong>Sigilo</strong></td><td>No ser visto ni oído, seguir a alguien, esconderse entre la gente, ocultar objetos (también al ser cacheado). Se enfrenta a Alerta.</td></tr><tr><td class="g-k"><strong>Volar</strong></td><td>Manejar una escoba: piruetas, carreras, Quidditch.</td></tr></tbody></table></div><h2>2. Carisma y Poder</h2><p class="g-sub">CARISMA</p><div class="g-tw"><table class="g-t"><thead><tr><th>HABILIDAD</th><th>LAS TIRADAS DE… SON PARA</th></tr></thead><tbody><tr><td class="g-k"><strong>Coordinación</strong></td><td>Organizar y liderar a un grupo para que actúe junto. También es la tirada de Seguidores.</td></tr><tr><td class="g-k"><strong>Intimidación</strong></td><td>Presión, miedo o autoridad para obtener algo. También es la tirada de Influencia.</td></tr><tr><td class="g-k"><strong>Oratoria</strong></td><td>Convencer y transmitir ideas, hablando o escribiendo. También es la tirada de Informantes.</td></tr><tr><td class="g-k"><strong>Seducir</strong></td><td>Caer bien, acercarse, convertir enemigos en aliados. Nunca fuerza deseo sexual en un PJ.</td></tr><tr><td class="g-k"><strong>Subterfugio</strong></td><td>Mentir, intrigar, doble juego, esconder motivos. Se enfrenta a Empatía.</td></tr></tbody></table></div><p class="g-sub">PODER</p><div class="g-tw"><table class="g-t"><thead><tr><th>HABILIDAD</th><th>LAS TIRADAS DE… SON PARA</th></tr></thead><tbody><tr><td class="g-k"><strong>Duelo</strong></td><td>Lanzar hechizos en combate. Es el Ataque Mágico (Poder + Duelo).</td></tr><tr><td class="g-k"><strong>Pociones</strong></td><td>Elaborar pociones.</td></tr><tr><td class="g-k"><strong>Rituales</strong></td><td>Ejecutar rituales, la magia que permanece en el tiempo.</td></tr></tbody></table></div><h2>3. Voluntad y Percepción</h2><p class="g-sub">VOLUNTAD</p><div class="g-tw"><table class="g-t"><thead><tr><th>HABILIDAD</th><th>LAS TIRADAS DE… SON PARA</th></tr></thead><tbody><tr><td class="g-k"><strong>Arte / Artesanía</strong></td><td>Crear o reparar con talento o con las manos, siempre dentro de la especialidad canjeada (Cocina, Forja, Pintura, Varitería…).</td></tr><tr><td class="g-k"><strong>Estilo</strong></td><td>Quedar bien al hacer algo, salga bien o mal. No supera otras tiradas.</td></tr><tr><td class="g-k"><strong>Frialdad</strong></td><td>Mantener la calma: resistir manipulación, interrogatorios, pánico o terror.</td></tr></tbody></table></div><p class="g-sub">PERCEPCIÓN</p><div class="g-tw"><table class="g-t"><thead><tr><th>HABILIDAD</th><th>LAS TIRADAS DE… SON PARA</th></tr></thead><tbody><tr><td class="g-k"><strong>Alerta</strong></td><td>Notar con los cinco sentidos lo que ocurre: que alguien se acerca, escuchar a escondidas.</td></tr><tr><td class="g-k"><strong>Consciencia</strong></td><td>Percibir lo sobrenatural: encantamientos, rastros mágicos, presentimientos, distinguir mago de muggle.</td></tr><tr><td class="g-k"><strong>Empatía</strong></td><td>Leer emociones y detectar mentiras.</td></tr><tr><td class="g-k"><strong>Iniciativa</strong></td><td>Orden de actuación en combate (Percepción + Iniciativa) y reaccionar rápido en la batalla.</td></tr><tr><td class="g-k"><strong>Investigación</strong></td><td>Buscar y unir pistas, resolver misterios y crímenes. También es la tirada de Biblioteca.</td></tr></tbody></table></div><h2>4. Inteligencia</h2><p>Son conocimientos: <strong>lo que el PJ sabe o recuerda</strong> del tema.</p><div class="g-tw"><table class="g-t"><thead><tr><th>HABILIDAD</th><th>LAS TIRADAS DE… SON PARA</th></tr></thead><tbody><tr><td class="g-k"><strong>Adivinación</strong></td><td>Interpretar presagios y métodos adivinatorios (posos de té, aritmancia, bola de cristal).</td></tr><tr><td class="g-k"><strong>Arcanismo</strong></td><td>Teoría de la magia: entender un hechizo o un rastro, tipos de magia, rituales oscuros. Saber, no poder.</td></tr><tr><td class="g-k"><strong>Callejeo</strong></td><td>Moverse en la calle: a quién preguntar, jerga, dónde comprar y vender, reconocer trapicheos.</td></tr><tr><td class="g-k"><strong>Cultura Mágica</strong></td><td>Saber académico del mundo mágico: historia, linajes, escuelas, Hogwarts.</td></tr><tr><td class="g-k"><strong>Cultura Muggle</strong></td><td>Manejarse en el mundo muggle: costumbres, transporte, máquinas, pasar desapercibido.</td></tr><tr><td class="g-k"><strong>Herbología</strong></td><td>Reconocer plantas y sus efectos, venenos, ingredientes.</td></tr><tr><td class="g-k"><strong>Magizoología</strong></td><td>Reconocer criaturas, sus rastros y debilidades; tratar y domar animales.</td></tr><tr><td class="g-k"><strong>Medicina</strong></td><td>Diagnosticar y curar: primeros auxilios, anatomía, tratar heridas.</td></tr><tr><td class="g-k"><strong>Política</strong></td><td>Instituciones, leyes y burocracia; moverse en el juego político y el Wizengamot.</td></tr><tr><td class="g-k"><strong>Supervivencia</strong></td><td>Vivir en la naturaleza: rastrear, encender fuego, orientarse, saber qué es comestible.</td></tr></tbody></table></div></div></details><details class="g-sec"><summary>IV. Tiradas de trasfondo</summary><div class="g-body"><h2>1. Con qué se tira cada trasfondo</h2><p>Los trasfondos son para conseguir <strong>información, favores o ayuda</strong> de personas o de libros. No sirven en combate ni contra un reto físico.</p><div class="g-tw"><table class="g-t"><thead><tr><th>TRASFONDO</th><th>SE TIRA CON</th><th>LAS TIRADAS SON PARA</th></tr></thead><tbody><tr><td class="g-k"><strong>Biblioteca</strong></td><td>Percepción + Investigación</td><td>Encontrar un dato concreto que esté en los libros o archivos del PJ.</td></tr><tr><td class="g-k"><strong>Informantes</strong></td><td>Percepción + Empatía</td><td>Saber algo que se comenta de persona a persona en ese ámbito: un rumor, un producto, un pequeño favor.</td></tr><tr><td class="g-k"><strong>Seguidores</strong></td><td>Carisma + Coordinación</td><td>Reunir gente fiel para <strong>una</strong> acción concreta. El nivel dice qué tan hábiles son; la tirada, cuántos vienen. Para otra tarea, se vuelve a tirar.</td></tr><tr><td class="g-k"><strong>Influencia</strong></td><td>Carisma + Intimidación</td><td>Imponerse en un grupo u organización para que le consigan materiales o recursos sin pagar.</td></tr></tbody></table></div><div class="g-note"><p><strong>✦ CÓMO SE ESCRIBE</strong></p><p>Siempre con el nombre completo: <strong>Informantes Política &gt; Azkaban</strong>, no "Informantes Azkaban".</p></div><h2>2. General, Específico y Ventajas</h2><p class="g-sub">GENERAL Y ESPECÍFICO EN LA TIRADA</p><ul><li> El <strong>General</strong> no da bonificador: solo habilita tiradas de ese trasfondo. </li><li> El <strong>Específico</strong> suma su bono a la tirada del trasfondo general correspondiente, no a la habilidad del tema. </li></ul><p class="g-sub">VENTAJAS QUE MODIFICAN LA TIRADA</p><div class="g-tw"><table class="g-t"><thead><tr><th>VENTAJA</th><th>EFECTO</th></tr></thead><tbody><tr><td class="g-k"><strong>Fama</strong></td><td>+1 uso de cualquier trasfondo por partida, por nivel, una vez agotados.</td></tr><tr><td class="g-k"><strong>Orden de Merlín</strong></td><td>Cada nivel se cambia por +4 a una tirada de trasfondo. Se declara antes de tirar y se gasta aunque sobre.</td></tr><tr><td class="g-k"><strong>Patrón</strong></td><td>Una vez por partida, tirar un trasfondo general que no se tiene, con +2 / +4 / +7 según nivel.</td></tr><tr><td class="g-k"><strong>Recursos</strong></td><td>Cada nivel sube el resultado un grado de dificultad. Se declara antes (de forma condicional) o después de ver el resultado.</td></tr></tbody></table></div></div></details><details class="g-sec"><summary>V. Chuleta rápida</summary><div class="g-body"><h2>Situación y tirada</h2><div class="g-tw"><table class="g-t"><thead><tr><th>SITUACIÓN</th><th>TIRADA</th></tr></thead><tbody><tr><td class="g-k">Alguien se acerca sin que el PJ lo espere</td><td>Percepción + Alerta (contra Sigilo)</td></tr><tr><td class="g-k">El PJ registra una habitación buscando pistas</td><td>Percepción + Investigación</td></tr><tr><td class="g-k">¿Este objeto está encantado?</td><td>Percepción + Consciencia</td></tr><tr><td class="g-k">¿Me está mintiendo?</td><td>Percepción + Empatía (contra Subterfugio)</td></tr><tr><td class="g-k">Pasar sin ser visto</td><td>Destreza + Sigilo (contra Alerta)</td></tr><tr><td class="g-k">Abrir una cerradura sin magia</td><td>Destreza + Latrocinio</td></tr><tr><td class="g-k">Escalar un muro o correr tras alguien</td><td>Vigor + Atletismo</td></tr><tr><td class="g-k">Convencer con argumentos</td><td>Carisma + Oratoria</td></tr><tr><td class="g-k">Engañar o hacerse pasar por otro</td><td>Carisma + Subterfugio</td></tr><tr><td class="g-k">Amenazar o imponerse</td><td>Carisma + Intimidación</td></tr><tr><td class="g-k">Caerle bien a alguien</td><td>Carisma + Seducir</td></tr><tr><td class="g-k">Organizar al grupo</td><td>Carisma + Coordinación</td></tr><tr><td class="g-k">No entrar en pánico o resistir un interrogatorio</td><td>Voluntad + Frialdad</td></tr><tr><td class="g-k">¿Qué criatura dejó este rastro?</td><td>Inteligencia + Magizoología</td></tr><tr><td class="g-k">¿Qué hechizo dejó este rastro?</td><td>Inteligencia + Arcanismo</td></tr><tr><td class="g-k">Curar o estabilizar a un herido</td><td>Inteligencia + Medicina</td></tr><tr><td class="g-k">Moverse por el Ministerio o la burocracia</td><td>Inteligencia + Política</td></tr><tr><td class="g-k">Conseguir algo en el mercado negro</td><td>Inteligencia + Callejeo</td></tr><tr><td class="g-k">Buscar el dato en sus libros</td><td>Biblioteca: Percepción + Investigación</td></tr><tr><td class="g-k">Preguntar a sus contactos</td><td>Informantes: Percepción + Empatía</td></tr></tbody></table></div></div></details>`;

function guiaFiltrar(q){
  const c=document.getElementById('guiaC'); if(!c) return;
  const norm=x=>x.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); q=norm(q.trim());
  const items=c.querySelectorAll('.g-card,.g-note,.g-t tbody tr,.g-body>p,.g-body>ul>li');
  let hits=0;
  items.forEach(el=>{ const ok=!q||norm(el.textContent).includes(q); el.classList.toggle('g-hide',!ok); if(ok&&q) hits++; });
  c.querySelectorAll('.g-tw').forEach(w=>w.classList.toggle('g-hide',!!q&&!w.querySelector('tbody tr:not(.g-hide)')));
  c.querySelectorAll('.g-body>ul').forEach(u=>u.classList.toggle('g-hide',!!q&&!u.querySelector('li:not(.g-hide)')));
  c.querySelectorAll('.g-body>h2,.g-body>p.g-sub').forEach(h=>h.classList.toggle('g-hide',!!q));
  c.querySelectorAll('details.g-sec').forEach(d=>{ if(q){ const any=d.querySelector('.g-card:not(.g-hide),.g-note:not(.g-hide),.g-t tbody tr:not(.g-hide),.g-body>p:not(.g-hide):not(.g-sub),.g-body>ul>li:not(.g-hide)'); d.classList.toggle('g-hide',!any); d.open=!!any; } else d.classList.remove('g-hide'); });
  const e=document.querySelector('.guia-empty'); if(e) e.hidden=!(q&&!hits);
}
document.addEventListener('input',e=>{ if(e.target.id==='guiaQ') guiaFiltrar(e.target.value); });

const EMOJI_RE=/[\p{Extended_Pictographic}\u2600-\u27BF\uFE0F\u200D]+\s*/gu;
function skinClean(root){
  if(!/skin-(chef|vanity|medical|nocturno)/.test(document.documentElement.className)) return;
  (root||document).querySelectorAll('.block h4, details.fold>summary, .sec-title, .stat .lbl, .vstat>span:first-child, .pill, .nav .btn, .btn, .mbar label, .hero .chip, .legend span, .mlegend span, .cplayer, .theme-panel>summary, .rules summary, table.t.view td b, .notes, .tab, .dice-sum, .mtab, .pma-card h2, .faltan-k').forEach(el=>{
    el.childNodes.forEach(n=>{ if(n.nodeType===3) n.nodeValue=n.nodeValue.replace(EMOJI_RE,'').replace(/^\s*✦\s*/,''); });
  });
}
function refreshCalcs(){
  const p=S.party; if(!p) return;
  document.querySelectorAll('[data-calc]').forEach(el=>{
    const k=el.dataset.calc;
    if(k==='bar'){ el.innerHTML=barHTML(getPath(p,el.dataset.p)); }
    else if(k==='sum'){ const tb=p.tb[el.dataset.tb]; el.innerHTML=sumPills(tb.ch[el.dataset.ch],tb); }
    else if(k==='prog'){ const tb=p.tb[el.dataset.tb]; el.style.width=charStats(tb.ch[el.dataset.ch],tb).pct+'%'; }
    else if(k==='msum'){ el.innerHTML=masterPills(p.tb[el.dataset.tb]); }
    else if(k==='ev'){ el.innerHTML=evSummary(p.tb[el.dataset.tb]); }
    else if(k==='leg'){ el.innerHTML=legendHTML(p.tb[el.dataset.tb]); }
  });
  skinClean();
}

async function copy(txt){ try{ await navigator.clipboard.writeText(txt); toast('✦ Copiado'); }catch(e){ const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');toast('✦ Copiado')}catch(_){} ta.remove(); } }

async function saveTurn(){
  const p=S.party;
  if(!S.pw){ pwModal(()=>saveTurn()); return; }
  if(p.mc){ modal(`<h3>Guardando…</h3><div class="script">comprobando la llave de la misión</div>`);
    try{ if(!await checkMissionPw(p.mc,S.pw)){ S.pw=null; closeModal(); toast('Esa no es la contraseña del master de esta misión'); pwModal(()=>saveTurn()); return; } }catch(e){ /* sin conexión: seguimos y se avisa abajo */ } }
  p.sv=(p.sv||0)+1; p.at=Date.now();
  let rg=null; try{ rg=p.rg?p.rg:(hasLogs(p)?await encLogs(p,S.pw):null); }catch(e){ toast('No se pudo cifrar el registro'); return; }
  const long=await encodeParty(p,rg);
  modal(`<h3>Guardando…</h3><div class="script">sellando el turno en la bóveda</div>`);
  let short='', err='', nuevo=false;
  try{
    if(p.mc){ try{ short=await fbUpdateMission(p.mc,long,S.pw); }catch(e){ if(e.old){ p.mc=''; } else throw e; } }
    if(!short){ short=await fbCreateMission(long,S.pw); p.mc=short; nuevo=true; }
  }catch(e){ err=e.message; }
  const code=short||long;
  S.lastCode=code; dirty=false; draftSave();
  const h=ls.get(LS_HIST,[]); h.unshift({code,long,at:p.at,sv:p.sv,title:p.title||'Sin título'}); ls.set(LS_HIST,h.slice(0,40));
  render();
  const link=linkFor(code);
  const bb=`[center][b]✦ Código de partida · Guardado n.º ${p.sv} ✦[/b]\n[code]${code}[/code]\n[url=${link}]Ver la tablilla[/url][/center]`;
  modal(`<h3>Turno guardado</h3><div class="script">Guardado n.º ${p.sv}</div>
    ${short?`<label class="f">Código de la misión ${nuevo?'<span class="pill gold">nuevo</span>':'<span class="pill">actualizado</span>'}</label>
      <div class="bigcode">${esc(short)}</div>`
    :`<div class="tip" style="background:rgba(var(--rosapolvo-rgb),.3)">No se pudo conectar con la base de datos (${esc(err)}). Te dejo el <b>código largo</b>, que funciona igual sin internet.</div>
      <label class="f">Código de partida (${long.length} caracteres)</label>`}
    <textarea class="in code-box" readonly id="outCode" style="${short?'position:absolute;left:-9999px;height:1px;min-height:0':''}">${esc(code)}</textarea>
    <div class="row">
      <button class="btn prime" data-copy="outCode">Copiar código</button>
      <button class="btn sm" data-copytext="${esc(link)}">🔗 Copiar link directo</button>
      <button class="btn sm" data-copytext="${esc(bb)}">Copiar con BBCode</button>
    </div>
    ${short?`<details class="rules" style="margin-top:12px"><summary>Código largo de respaldo</summary>
      <textarea class="in code-box" readonly style="margin-top:8px">${esc(long)}</textarea>
      <div class="muted">Funciona aunque Firebase esté caído: lleva toda la partida adentro.</div></details>`:''}
    <div class="tip">${short?(nuevo?'Este es el <b>código fijo de la misión</b>: publicalo una sola vez. Cada vez que guardes, se actualiza solo y los jugadores ven siempre lo último con el mismo código.':'Se actualizó el <b>mismo código</b>: no hace falta publicar nada nuevo, los jugadores ya ven este guardado.')+' Solo quien tenga la contraseña del master puede actualizarlo.':'Cuando vuelva la conexión, guardá otra vez para actualizar el código de la misión.'}</div>`);
}

    else fz.cur=el.value===''?0:+el.value;

    if(k==='tp') st.th='';
    if(['c','h','tp','th','tf','pd','df','ap'].includes(k)||el.tagName==='SELECT') refreshDice(ti);
    else { const pv=document.querySelector(`#dice-${ti} .dice-prev`); if(pv){ const keep=document.activeElement; refreshDice(ti); const again=document.querySelector(`#dice-${ti} [data-dk="${k}"]`); if(again&&keep===el){ again.focus(); try{again.setSelectionRange(again.value.length,again.value.length)}catch(_){} } } }
    return; }
  if(S.mode!=='master'||!el.dataset.k) return;
  let v=el.value; if(el.type==='checkbox') v=el.checked?1:0; else if(el.dataset.num) v=v.trim()===''?'':(isNaN(+v)?v:+v);
  setPath(S.party,el.dataset.k,v);
  if(el.dataset.turn==='m'){ const [,ti,,,i]=el.dataset.k.split('.'); const tb=S.party.tb[ti];
    if(v==='X'&&!(tb.m.f[i]>0)) tb.m.f[i]=1; markDirty(); render(); return; }
  if(el.dataset.fcnt!==undefined){ const nf=Math.max(0,parseInt(el.value)||0); setPath(S.party,el.dataset.k,nf);
    const w=el.previousElementSibling; if(w){ w.firstChild.textContent='✓'+nf; w.title='Posteó con '+nf+' faltas'; } }
  if(el.dataset.turn){ const w=el.parentElement, m=el.dataset.turn==='m'; w.className='tsel st-'+(v||'_');
    w.firstChild.textContent=(m?MST_SHORT:ST_SHORT)[v]||'·'; w.title='Turno: '+((m?MST:ST)[v]||'—'); }
  { const m=el.dataset.k.match(/^(tb\.\d+\.ch\.\d+)\.at\.(\w+)$/); if(m){ const ch=getPath(S.party,m[1]); if(ch.atd) delete ch.atd[m[2]]; el.classList.remove('calc'); } }
  markDirty(); refreshCalcs();
  if(/\.(at|hb|tr|pd)\./.test(el.dataset.k)||/\.n$/.test(el.dataset.k)){ const ti=+el.dataset.k.split('.')[1]; if(document.activeElement!==el||el.tagName==='SELECT') refreshDice(ti); }
  if(el.dataset.k==='title') heroMeta(S.party);
});
document.addEventListener('change',e=>{
  const el=e.target;
  if((el.dataset.fzh||el.dataset.fzcur!==undefined)&&S.mode==='master'){ render(); return; }
  if(el.id==='vfilter'){ S.filter=el.value; render(); return; }
  if(el.dataset.nt!==undefined){ const tb=S.party.tb[el.dataset.nt]; tb.nt=Math.max(1,Math.min(60,parseInt(el.value)||20));
    tb.m.t=fromT(tb.m.t,tb.nt); tb.m.f=fromF(tb.m.f,tb.nt); tb.ch.forEach(c=>c.t=fromT(c.t,tb.nt)); markDirty(); render(); }
  if(S.mode==='master'&&el.dataset.k&&/^tb\.\d+\.n$|\.img$/.test(el.dataset.k)) render(); // imagen / nombre de pestaña
});
document.addEventListener('click',async e=>{
  const b=e.target.closest('button,[data-close-bg]'); if(!b) return;
  const d=b.dataset;
  if(d.closeBg!==undefined){ if(e.target===b) closeModal(); return; }
  if(d.close){ closeModal(); return; }
  if(d.seen){ try{ const r=await loadAny(d.seen); S.view=r.party; S.lastViewCode=r.code; S.vtab=0; S.filter=''; S.mode='view'; rememberSeen(r.code,r.party); history.replaceState(null,'',linkFor(r.code)); render(); window.scrollTo(0,0); }catch(err){ toast('No se pudo abrir esa partida'); } return; }
  if(d.hdel!==undefined){ if(!b.dataset.armed){ b.dataset.armed='1'; b.classList.add('armed'); b.textContent='¿Quitar?'; setTimeout(()=>{ if(b.isConnected){ b.textContent='✕'; b.classList.remove('armed'); delete b.dataset.armed; } },2500); return; }
    const all=ls.get(LS_HIST,[]), x=all[+d.hdel]; if(!x) return; const key=h=>isShort(h.code)?h.code:h.title;
    ls.set(LS_HIST,all.filter(h=>key(h)!==key(x))); render(); toast('Quitada de tu lista (el código sigue funcionando)'); return; }
  if(d.sdel!==undefined){ if(!b.dataset.armed){ b.dataset.armed='1'; b.classList.add('armed'); b.textContent='¿Quitar?'; setTimeout(()=>{ if(b.isConnected){ b.textContent='✕'; b.classList.remove('armed'); delete b.dataset.armed; } },2500); return; }
    ls.set(LS_SEEN,ls.get(LS_SEEN,[]).filter(x=>x.code!==d.sdel)); render(); toast('Quitada de tu lista'); return; }
  if(d.hopen!==undefined){ const x=ls.get(LS_HIST,[])[+d.hopen]; if(!x) return; if(dirty&&!confirmInline(b,'Tenés cambios sin guardar: tocá otra vez')) return;
    S.pw=null; S.dice={}; S.party=null; if(isShort(x.code)){ try{ S.party=(await loadAny(x.code)).party; }catch(e){} } if(!S.party){ S.party=await decodeParty(x.long||x.code); if(isShort(x.code)) S.party.mc=x.code; } S.lastCode=x.code; S.tab=0; dirty=false; draftSave(); S.mode='master'; render(); window.scrollTo(0,0); toast('✦ '+(x.title||'Partida')+' abierta'); return; }
  if(d.gomasterLoad){ S.mode='master'; render(); loadModal(); return; }
  if(d.fresh&&S.party&&(S.party.title||S.party.tb.some(t=>t.ch.some(c=>c.n)))){ if(!confirmInline(b,'Se reemplaza tu borrador: tocá otra vez')) return; S.pw=null; S.dice={}; S.party=newParty(); S.tab=0; dirty=false; draftSave(); }
  if(d.mode){ S.mode=d.mode; if(d.mode==='view'&&!S.view) S.filter=''; render(); window.scrollTo(0,0); return; }
  if(d.tab!==undefined){ if(S.mode==='view'){S.vtab=+d.tab;S.filter='';} else S.tab=+d.tab; render(); return; }
  if(d.loadView){ const code=document.getElementById(d.loadView).value; b.disabled=true; try{ const r=await loadAny(code); S.view=r.party; S.lastViewCode=r.code; S.vtab=0; S.filter=''; S.mode='view'; rememberSeen(r.code,r.party); history.replaceState(null,'',linkFor(r.code)); render(); }catch(err){ b.disabled=false; toast(err.message==='Ese código no existe'?'Ese código no existe ✧ revisalo':/ficha/.test(err.message)?err.message:'Código no válido ✧ revisá que esté completo'); } return; }
  if(d.clearView){ S.view=null; S.lastViewCode=''; history.replaceState(null,'',baseURL()); render(); return; }
  if(d.copyLink){ copy(linkFor(S.lastViewCode)); return; }
  if(d.save){ saveTurn(); return; }
  if(d.open==='load'){ loadModal(); return; }
  if(d.open==='hist'){ histModal(); return; }
  if(d.copy){ copy(document.getElementById(d.copy).value); return; }
  if(d.copytext){ copy(d.copytext); return; }
  if(d.loadMaster){ try{ S.pw=null; S.dice={}; S.party=(await loadAny(document.getElementById(d.loadMaster).value)).party; if(S.party.mc) S.lastCode=S.party.mc; S.tab=0; dirty=false; draftSave(); closeModal(); render(); toast('✦ Partida cargada'); }catch(err){ toast('Código no válido'); } return; }
  if(d.hcopy!==undefined){ copy(ls.get(LS_HIST,[])[d.hcopy].code); return; }
  if(d.hload!==undefined){ const x=ls.get(LS_HIST,[])[d.hload]; S.party=await decodeParty(x.long||x.code); if(isShort(x.code)) S.party.mc=x.code; S.lastCode=x.code; S.tab=0; dirty=false; draftSave(); closeModal(); render(); toast('✦ Guardado n.º '+x.sv+' abierto'); return; }
  if(d.newparty){ if(confirmInline(b,'¿Seguro? Toca otra vez')){ S.pw=null; S.dice={}; S.party=newParty(); S.tab=0; dirty=false; draftSave(); render(); } return; }
  if(S.mode!=='master') return;
  const p=S.party;
  if(d.preset!==undefined){ const x=PRESETS[d.preset]; setTheme({h:x.h,k:x.k,m:x.m,d:x.d||0,s:x.s||''}); return; }
  if(d.dark!==undefined){ setTheme({d:+d.dark}); return; }
  if(d.metal){ setTheme({m:d.metal}); return; }
  if(d.import!==undefined){ importModal(+d.import, d.ci===undefined||d.ci===''?undefined:+d.ci); return; }
  if(d.doimport!==undefined){
    b.disabled=true;
    try{ const txt=document.getElementById('fichaCode').value;
      const longs=txt.match(/AVK[01]\.[A-Za-z0-9_-]+/g)||[], shorts=txt.match(/\bAK-?\s?\d{5}\b/gi)||[];
      const codes=longs.length?longs:shorts;            // si hay códigos largos, alcanzan (no hace falta internet)
      let list=[];
      if(codes.length>1){ const best=new Map();
        for(const c of codes){ let raw; try{ raw=await decodeFicha(/^AVK/i.test(c)?c:c.replace(/[^0-9A-Za-z]/g,'')); }catch(_){ continue; }
          (Array.isArray(raw)?raw:[raw]).forEach(f=>{ if(!(f.atributos||f.habilidades||f.combate)) return; const k=(f.personaje||'').trim().toLowerCase(), sz=JSON.stringify(f).length;
            if(!best.has(k)||best.get(k).sz<sz) best.set(k,{f,sz}); }); }
        list=[...best.values()].map(x=>x.f); }
      else { const raw=await decodeFicha(txt); list=Array.isArray(raw)?raw:[raw]; }
      if(!list.length) throw new Error('No encontré fichas con datos en ese texto');
      const tb=p.tb[+d.doimport], ci=d.ci===''?undefined:+d.ci;
      if(ci===undefined){ list.forEach(f=>{ const c=fichaToChar(f); c.id=uid(); c.t=fromT([],tb.nt); tb.ch.push(c); }); }
      else { const f=list[0], old=tb.ch[ci]; const c=fichaToChar(f,old); c.img=old.img; c.p=old.p; c.t=old.t; tb.ch[ci]=c; }
      markDirty(); closeModal(); render();
      toast(list.length>1?`✦ ${list.length} fichas cargadas`:'✦ Ficha de '+(list[0].personaje||'personaje')+' cargada');
    }catch(err){ b.disabled=false; toast(err.message||'Código de ficha no válido'); }
    return; }
  if(d.mtab){ S.mtab=d.mtab; render(); window.scrollTo(0,0); return; }
  if(d.guiaAll||d.guiaNone){ document.querySelectorAll('#guiaC details.g-sec').forEach(x=>x.open=!!d.guiaAll); return; }
  if(d.dk&&d.val!==undefined){ const ti=+d.ti, st=diceState(ti,p.tb[ti]); st[d.dk]=d.val; refreshDice(ti); return; }
  if(d.dmod!==undefined){ const ti=+d.ti, st=diceState(ti,p.tb[ti]); st.mod=+d.dmod===0?0:n(st.mod)+(+d.dmod); refreshDice(ti); return; }
  if(d.roll!==undefined){ doRoll(+d.roll); return; }
  if(d.posteo||d.ptnow){ const [ti,ci]=(d.posteo||d.ptnow).split('.').map(Number), tb=p.tb[ti], t=turnoActual(tb), ch=tb.ch[ci];
    ch.pt[t]=argInput(new Date()); const r=aplicarHora(tb,t,ch); if(!r) ch.t[t-1]=FASE_LET[fase(tb,t).f]||'N';
    markDirty(); render(); toast(`✦ ${ch.n}: turno ${t} = ${ST[ch.t[t-1]]}${r?' ('+r.why+')':''}`); return; }
  if(d.crok){ const [ti,ci]=d.crok.split('.').map(Number); crAdd(ti,ci); return; }
  if(d.logview!==undefined){ S.logView[+d.logview]=d.val; refreshDice(+d.logview); return; }
  if(d.copylog!==undefined){ const t=p.tb[+d.copylog]; copy(logText(t,S.logView[+d.copylog]||(t.ev?'pj':'turno'))); return; }
  if(d.dellog){ const [ti,i]=d.dellog.split('.').map(Number); if(confirmInline(b,'¿?')){ p.tb[ti].lg.splice(i,1); markDirty(); if(b.closest('.cr-lg')) render(); else refreshDice(ti); } return; }
  if(d.setpw){ pwModal(); return; }
  if(d.pwok){ const a=document.getElementById('pw1').value, p2=document.getElementById('pw2'), c2=p2?p2.value:a;
    if(a.length<4){ toast('Usá al menos 4 caracteres'); return; } if(a!==c2){ toast('Las contraseñas no coinciden'); return; }
    S.pw=a; closeModal(); toast('🔑 Contraseña guardada'); render(); const f=S.pwAfter; S.pwAfter=null; if(f) f(); return; }
  if(d.unlock){ const pw=document.getElementById('unlockPw').value;
    try{ const logs=await decLogs(p.rg,pw); p.tb.forEach((t,i)=>t.lg=Array.isArray(logs[i])?logs[i]:[]); delete p.rg; S.pw=pw; draftSave(); render(); toast('🔓 Registro desbloqueado'); }
    catch(err){ toast('Contraseña incorrecta'); } return; }
  if(d.addhab){ const nm=prompt('Nombre de la habilidad (ej: Arte (Pintura) o Artesanía (Cocina))'); if(!nm) return;
    const ch=getPath(p,d.addhab); const k='x_'+nm.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'_');
    ch.hx[k]=[nm,'voluntad']; ch.hb[k]=0; markDirty(); render(); return; }
  if(d.evset!==undefined){ p.tb[+d.evset].ev=+d.ev; markDirty(); render(); return; }
  if(d.eset!==undefined){ const tb=p.tb[+d.eset]; tb.e[d.key]=d.val; if(d.key==='md') tb.ch.forEach(c=>{ if(d.val==='uno'&&c.pz>1) c.pz=0; }); markDirty(); render(); return; }
  if(d.addtab){ p.tb.push(newTab(p.tb.length+1)); S.tab=p.tb.length-1; markDirty(); render(); return; }
  if(d.deltab!==undefined&&p.rg){ toast('Desbloqueá el registro de tiradas antes de eliminar una tablilla'); return; }
  if(d.deltab!==undefined){ if(p.tb.length<2){toast('Tiene que quedar al menos una tablilla');return;} if(confirmInline(b,'¿Eliminar? Toca otra vez')){ p.tb.splice(+d.deltab,1); S.tab=0; markDirty(); render(); } return; }
  if(d.addch!==undefined){ const tb=p.tb[d.addch]; const c=newChar(); c.t=fromT([],tb.nt); tb.ch.push(c); markDirty(); render(); return; }
  if(d.delch){ if(confirmInline(b,'¿Eliminar? Toca otra vez')){ const [ti,ci]=d.delch.split('.').map(Number); p.tb[ti].ch.splice(ci,1); markDirty(); render(); } return; }
  if(d.dup){ const [ti,ci]=d.dup.split('.').map(Number); const c=JSON.parse(JSON.stringify(p.tb[ti].ch[ci])); c.id=uid(); c.n=(c.n||'Personaje')+' (copia)'; p.tb[ti].ch.splice(ci+1,0,c); markDirty(); render(); return; }
  if(d.add){ const arr=getPath(p,d.p+'.'+d.add);
    arr.push(d.add==='inv'?{c:arr.length?arr[arr.length-1].c:'Básico',o:'',u:'',m:'',d:''}:d.add==='tr'?{n:'',c:'',l:'',u:'',m:'',d:''}:{n:'',l:'',u:'',m:'',d:''});
    const ch=getPath(p,d.p); S.folds[`m:${ch.id}:${d.add}`]=true; ls.set(LS_FOLDS,S.folds);
    markDirty(); render();
    // enfoca la fila nueva para escribir directo
    const k=`${d.p}.${d.add}.${arr.length-1}.${d.add==='inv'?'o':'n'}`, el=document.querySelector(`[data-k="${k}"]`);
    if(el){ el.focus(); el.scrollIntoView({block:'center',behavior:'smooth'}); }
    return; }
  if(d.del){ getPath(p,d.del).splice(+d.i,1); markDirty(); render(); return; }
});
function confirmInline(btn,msg){ if(btn.dataset.armed){ return true; } btn.dataset.armed='1'; const o=btn.textContent; btn.textContent=msg; setTimeout(()=>{ if(btn.isConnected){btn.textContent=o; delete btn.dataset.armed;} },2500); return false; }
document.addEventListener('keydown',e=>{ const el=e.target; if(e.key==='Enter'&&el.dataset&&el.dataset.ck){ e.preventDefault(); crAdd(+el.dataset.ti,+el.dataset.ci); } });
window.addEventListener('beforeunload',e=>{ if(dirty&&S.mode==='master'){ e.preventDefault(); e.returnValue=''; } });

/* ════════════════ INICIO ════════════════ */
setFaseTimer();
(async function init(){
  const dr=ls.get(LS_DRAFT,null);
  if(dr&&dr.party){ try{ S.party=normParty(dr.party); S.lastCode=dr.lastCode||''; }catch(e){} }
  const h=location.hash;
  if(/^#[pc]=/.test(h)){
    S.mode='view'; render();
    try{ const r=await loadAny(h); S.view=r.party; S.lastViewCode=r.code; rememberSeen(r.code,r.party); }catch(e){ toast('El link tiene un código no válido'); }
  }
  render();
})();
</script>
